<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🏃‍♂️ Run & Conquer · Workout & Sport</title>
    
    <!-- Leaflet & Plugins -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ---------- FARBPALETTE (Workout & Sport) ---------- */
        :root {
            --bg-deep: #021024;
            --bg-dark: #052659;
            --primary: #5483B3;
            --secondary: #7DA0CA;
            --accent: #C1E8FF;
            --text-light: #ffffff;
            --text-muted: rgba(255,255,255,0.6);
            --card-bg: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-deep);
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---------- ONBOARDING ---------- */
        #onboarding {
            position: fixed; inset: 0;
            background: linear-gradient(145deg, var(--bg-deep) 0%, var(--bg-dark) 100%);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; padding: 24px;
            backdrop-filter: blur(10px);
        }
        .onboarding-card {
            background: rgba(5, 38, 89, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 48px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3);
        }
        .onboarding-logo {
            font-size: 3rem; font-weight: 800; letter-spacing: 2px;
            color: var(--accent); margin-bottom: 16px;
        }
        .onboarding-title {
            font-size: 2.4rem; font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            -webkit-background-clip: text; background-clip: text;
            color: transparent; margin-bottom: 8px;
        }
        .onboarding-sub {
            color: var(--text-muted); margin-bottom: 40px; font-weight: 500;
        }
        .input-group { margin-bottom: 24px; text-align: left; }
        .input-group label {
            font-weight: 600; margin-bottom: 8px; color: var(--accent);
            text-transform: uppercase; letter-spacing: 0.5px; font-size: 0.8rem;
        }
        .input-group input {
            width: 100%; padding: 16px 20px; font-size: 1rem;
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            border-radius: 60px; color: var(--text-light); outline: none;
            transition: all 0.2s;
        }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(84,131,179,0.2); }
        .color-options { display: flex; gap: 12px; margin-top: 8px; }
        .color-option {
            width: 44px; height: 44px; border-radius: 44px; cursor: pointer;
            border: 3px solid transparent; transition: 0.15s;
        }
        .color-option.selected { border-color: var(--accent); transform: scale(1.1); }
        .avatar-selector { display: flex; gap: 12px; justify-content: center; margin-top: 8px; }
        .avatar-option {
            font-size: 2rem; cursor: pointer; padding: 8px; border-radius: 60px;
            background: rgba(255,255,255,0.05); border: 2px solid transparent;
            transition: 0.15s;
        }
        .avatar-option.selected { border-color: var(--accent); background: rgba(84,131,179,0.3); }
        .btn-start {
            background: var(--primary); color: white; border: none; padding: 18px 24px;
            border-radius: 60px; font-weight: 700; font-size: 1.2rem; width: 100%;
            box-shadow: 0 10px 25px -5px rgba(84,131,179,0.4); cursor: pointer;
            transition: all 0.2s; margin-top: 16px;
        }
        .btn-start:active { transform: scale(0.97); }

        /* ---------- HAUPT-APP ---------- */
        #mainApp {
            display: none;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }

        /* Header – schlank */
        .app-header {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(2, 16, 36, 0.8); backdrop-filter: blur(20px);
            padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
            z-index: 20; height: 60px;
        }
        .app-title {
            font-size: 1.4rem; font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            font-size: 1.2rem; color: var(--text-light); width: 40px; height: 40px;
            border-radius: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .icon-btn:active { background: var(--primary); }

        /* Haupt-Container */
        #screenContainer {
            position: fixed; top: 60px; left: 0; right: 0; bottom: 0;
            overflow-y: auto; padding: 20px 20px 120px;
        }

        /* Hero / Statistik-Karte */
        .hero-stat {
            text-align: center; margin-bottom: 30px;
        }
        .hero-value {
            font-size: 5rem; font-weight: 800; color: var(--accent);
            line-height: 1; margin-bottom: 8px;
        }
        .hero-label {
            font-size: 1rem; color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Grid mit kleinen Statistiken */
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            margin-bottom: 30px;
        }
        .stat-item {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 16px 8px; text-align: center;
        }
        .stat-item .value { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
        .stat-item .label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }

        /* Großer Action-Button */
        .action-btn {
            width: 100%; background: var(--primary); color: white;
            border: none; padding: 22px; border-radius: 100px;
            font-weight: 700; font-size: 1.6rem; letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(84,131,179,0.4);
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 30px;
        }
        .action-btn:active { transform: scale(0.97); }
        .action-btn.running { background: #c0392b; box-shadow: 0 10px 30px rgba(192,57,43,0.4); }

        /* Aktivitäts-Zusammenfassung */
        .activity-summary {
            background: linear-gradient(135deg, var(--bg-dark), var(--primary));
            border-radius: 28px; padding: 24px; margin-bottom: 24px;
        }
        .activity-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); }
        .activity-stats { display: flex; justify-content: space-around; margin: 20px 0; }
        .activity-stat { text-align: center; }
        .activity-stat .value { font-size: 2rem; font-weight: 800; }
        .activity-stat .label { font-size: 0.8rem; color: var(--text-muted); }

        /* Drawer */
        #drawer {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-dark);
            border-top: 1px solid var(--glass-border); border-radius: 32px 32px 0 0;
            z-index: 2000; max-height: 75vh; overflow-y: auto; display: none;
            flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2,0.9,0.4,1);
            padding-bottom: 20px;
        }
        #drawer.visible { transform: translateY(0); }
        .drawer-handle { width: 40px; height: 4px; background: var(--glass-border); border-radius: 4px; margin: 12px auto 8px; }
        .drawer-tabs { display: flex; gap: 4px; padding: 8px 16px; overflow-x: auto; }
        .tab-btn {
            padding: 8px 16px; border-radius: 40px; border: none; background: var(--card-bg);
            color: var(--text-muted); font-weight: 600; font-size: 0.8rem; cursor: pointer;
            white-space: nowrap; transition: all 0.2s;
        }
        .tab-btn.active { background: var(--primary); color: white; }
        .drawer-content { padding: 16px; }

        /* Toast & Modals */
        #toast {
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: white; padding: 12px 24px;
            border-radius: 60px; z-index: 5000; opacity: 0; transition: 0.2s;
            pointer-events: none; white-space: nowrap; font-weight: 600;
        }
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 4000; padding: 20px;
        }
        .modal-card {
            background: var(--bg-dark); border: 1px solid var(--glass-border);
            border-radius: 32px; padding: 24px; max-width: 380px; width: 100%;
            max-height: 80vh; overflow-y: auto;
        }
        .modal-title { font-size: 1.8rem; font-weight: 700; margin-bottom: 20px; color: var(--accent); }
        .modal-input {
            width: 100%; padding: 16px; background: var(--card-bg);
            border: 1px solid var(--glass-border); border-radius: 20px;
            color: white; font-size: 1rem; margin-bottom: 16px; outline: none;
        }
        .modal-actions { display: flex; gap: 12px; }
        .calendar { margin-top: 10px; }
        .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .calendar-day { text-align: center; padding: 8px; border-radius: 12px; background: var(--card-bg); font-size: 0.8rem; }
        .calendar-day.has-run { background: var(--primary); color: white; font-weight: bold; }
        .calendar-day.other-month { opacity: 0.4; }
        .day-detail { margin-top: 20px; padding: 16px; background: var(--card-bg); border-radius: 20px; }
        .fitness-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .muted { color: var(--text-muted); }
        .landmark-icon { font-size: 20px; text-shadow: 0 0 8px var(--accent); }
        .bluetooth-btn { background: var(--card-bg); border: 1px solid var(--primary); color: var(--accent); }
        
        #mapContainer {
            display: none;
            position: fixed; top: 60px; left: 0; right: 0; bottom: 0;
            z-index: 50; background: #0d1117;
        }
        #map { height: 100%; width: 100%; }
        #closeMapBtn {
            position: absolute; top: 16px; right: 16px; z-index: 100;
            background: var(--primary); border: none; color: white;
            width: 48px; height: 48px; border-radius: 30px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<!-- ONBOARDING -->
<div id="onboarding">
    <div class="onboarding-card">
        <div class="onboarding-logo">R&C</div>
        <div class="onboarding-title">Workout & Sport</div>
        <div class="onboarding-sub">Lauf · Erobere · Verteidige</div>
        <div class="input-group">
            <label>Dein Name</label>
            <input type="text" id="playerNameInput" placeholder="z.B. SpeedRunner" maxlength="20">
        </div>
        <div class="input-group">
            <label>Farbe</label>
            <div class="color-options" id="colorOptions"></div>
        </div>
        <div class="input-group">
            <label>Avatar</label>
            <div class="avatar-selector" id="avatarSelector"></div>
        </div>
        <button class="btn-start" id="startAppBtn">LOS GEHT'S →</button>
    </div>
</div>

<!-- HAUPT-APP -->
<div id="mainApp">
    <div class="app-header">
        <div class="app-title">Workout & Sport</div>
        <div class="header-actions">
            <button class="icon-btn" id="profileBtn"><i class="fas fa-user"></i></button>
            <button class="icon-btn" id="mapViewBtn"><i class="fas fa-map"></i></button>
            <button class="icon-btn" id="menuBtn"><i class="fas fa-chart-bar"></i></button>
        </div>
    </div>

    <div id="screenContainer">
        <div class="hero-stat">
            <div class="hero-value" id="heroTotalKm">0.0</div>
            <div class="hero-label">Gesamtkilometer</div>
        </div>

        <div class="stats-grid">
            <div class="stat-item"><div class="value" id="statPoints">0</div><div class="label">Punkte</div></div>
            <div class="stat-item"><div class="value" id="statArea">0</div><div class="label">m²</div></div>
            <div class="stat-item"><div class="value" id="statDefense">0</div><div class="label">Vert.</div></div>
        </div>

        <button class="action-btn" id="mainActionBtn"><i class="fas fa-play"></i> START</button>

        <div class="activity-summary">
            <div class="activity-title">Heutige Aktivität</div>
            <div class="activity-stats">
                <div class="activity-stat"><span class="value" id="todayDistance">0.0</span><span class="label">km</span></div>
                <div class="activity-stat"><span class="value" id="todayTime">00:00</span><span class="label">Zeit</span></div>
                <div class="activity-stat"><span class="value" id="todayPace">--</span><span class="label">Pace</span></div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div style="background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px;">
                <div style="font-size:1.8rem; font-weight:700; color:var(--accent);" id="dashCalories">0</div>
                <div style="color:var(--text-muted);">Kalorien</div>
                <div style="color:#10b981;" id="calTrend">+0%</div>
            </div>
            <div style="background: var(--card-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px;">
                <div style="font-size:1.8rem; font-weight:700; color:var(--accent);" id="dashSteps">0</div>
                <div style="color:var(--text-muted);">Schritte</div>
            </div>
        </div>
    </div>

    <div id="mapContainer">
        <div id="map"></div>
        <button id="closeMapBtn"><i class="fas fa-times"></i></button>
    </div>

    <div id="drawer">
        <div class="drawer-handle"></div>
        <div class="drawer-tabs">
            <button class="tab-btn active" data-tab="history">Verlauf</button>
            <button class="tab-btn" data-tab="quests">Quests</button>
            <button class="tab-btn" data-tab="terr">Gebiete</button>
            <button class="tab-btn" data-tab="fitness">Fitness</button>
            <button class="tab-btn" data-tab="ach">Erfolge</button>
            <button class="tab-btn" data-tab="calendar">Kalender</button>
        </div>
        <div class="drawer-content" id="drawerContent"></div>
    </div>
</div>

<!-- MODALS -->
<div id="postRunModal" class="modal" style="display: none;">
    <div class="modal-card">
        <div class="modal-title">LAUF BEENDET 🎉</div>
        <div id="postRunStats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px;"></div>
        <div style="text-align: center; background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 16px;">
            <div style="font-size: 2.6rem; font-weight: 800; color: var(--accent);" id="postRunPoints">+0</div>
            <div style="color: var(--text-muted);">Punkte verdient</div>
        </div>
        <div id="songContainer"></div>
        <button class="btn btn-primary" id="closePostRunModal" style="width:100%; margin-top:16px; background:var(--primary); color:white; border:none; padding:16px; border-radius:40px; font-weight:700;">WEITER →</button>
    </div>
</div>

<div id="renameModal" class="modal" style="display: none;">
    <div class="modal-card">
        <div class="modal-title">GEBIET ✏️</div>
        <input type="text" id="renameInput" class="modal-input" placeholder="Gebietsname eingeben">
        <div class="modal-actions">
            <button class="btn btn-primary" id="saveRenameBtn" style="background:var(--primary);">Speichern</button>
            <button class="btn" id="closeRenameModal">Abbrechen</button>
        </div>
        <hr style="margin:20px 0; border-color:var(--glass-border);">
        <div id="allTerritoriesList"></div>
    </div>
</div>

<div id="profileModal" class="modal" style="display: none;">
    <div class="modal-card">
        <div class="modal-title">PROFIL ✏️</div>
        <div class="input-group">
            <label>Name</label>
            <input type="text" id="editNameInput" class="modal-input" placeholder="Dein Name">
        </div>
        <div class="input-group">
            <label>Farbe</label>
            <div class="color-options" id="editColorOptions"></div>
        </div>
        <div class="input-group">
            <label>Avatar</label>
            <div class="avatar-selector" id="editAvatarSelector"></div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-primary" id="saveProfileBtn" style="background:var(--primary);">Speichern</button>
            <button class="btn" id="closeProfileModal">Abbrechen</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    (function(){
        "use strict";

        // ---------- FARBEN & AVATARE ----------
        const COLORS = ["#C1E8FF", "#5483B3", "#7DA0CA", "#052659", "#021024"];
        const AVATARS = ["🏃", "🚴", "🏋️", "🤸", "⚡"];

        // ---------- KONFIGURATION ----------
        const CFG = {
            MIN_DISTANCE_M: 150, TOLERANCE_PERCENT: 0.1, MIN_TOLERANCE_M: 60, MAX_TOLERANCE_M: 300,
            LINE_BUFFER_M: 25, PRECISION_BONUS_MAX: 1.5, LANDMARK_DEFENSE_BONUS: 1.3, LANDMARK_POINTS: 300,
            WEAK_SPOT_THRESHOLD: 0.7, WEAK_SPOT_MULTIPLIER: 1.2, OVERLOAD_THRESHOLD: 800, OVERLOAD_FACTOR: 0.5,
            CRIT_CHANCE: 0.15, CRIT_MULTIPLIER: 2.0, COMBO_TIMEOUT_HOURS: 24, DECAY_INTERVAL_MS: 60000,
            MAX_DEFENSE_CAP: 1200, BASE_DEFENSE_PER_M2: 0.02, BASE_DEFENSE_PER_M_DIST: 0.5,
            ATTACK_MULTIPLIER: 0.8, DECAY_PERCENT_PER_HOUR: 0.04, MAX_AGE_HOURS: 96,
            ENERGY_MAX: 3, ENERGY_REGEN_HOURS: 8, STEP_THRESHOLD: 12, STEP_MIN_INTERVAL_MS: 250,
            HR_BASE: 70, HR_PACE_FACTOR: 5.5
        };

        // ---------- STATE ----------
        let map, userMarker, pathLayer, territoryLayer, heatLayer, landmarkLayer;
        let isRunning = false, watchId = null;
        let currentPath = [], lastPosition = null, totalDistance = 0;
        let territories = [], userPoints = 0, userId = 'user', playerName = '', userColor = COLORS[0], userAvatar = AVATARS[0];
        let energy = CFG.ENERGY_MAX, lastEnergyUpdate = Date.now();
        let boostActive = false, boostUsedToday = false;
        let runHistory = [], quests = [], achievements = [];
        let heatmapEnabled = true;
        let totalKmRun = 0, totalConquered = 0, totalDefended = 0;
        let streakDays = 0, stepsToday = 0, lastStepUpdate = 0;
        let runStartTime = null, runElapsedSeconds = 0;
        let selectedTerritoryId = null;
        let currentTab = 'history';
        let landmarks = [];
        let heartRate = 72, heartRateSource = 'sim';
        let bluetoothDevice = null, btServer = null, hrCharacteristic = null;
        let fitnessData = { steps: 0, totalKm: 0, totalKcal: 0, lastHR: 72 };
        let calendarCurrentDate = new Date();

        // UI Elements
        const heroTotalKm = document.getElementById('heroTotalKm');
        const statPoints = document.getElementById('statPoints');
        const statArea = document.getElementById('statArea');
        const statDefense = document.getElementById('statDefense');
        const mainActionBtn = document.getElementById('mainActionBtn');
        const todayDistance = document.getElementById('todayDistance');
        const todayTime = document.getElementById('todayTime');
        const todayPace = document.getElementById('todayPace');
        const dashCalories = document.getElementById('dashCalories');
        const dashSteps = document.getElementById('dashSteps');
        const drawer = document.getElementById('drawer');
        const drawerContent = document.getElementById('drawerContent');
        const toast = document.getElementById('toast');
        const mapContainer = document.getElementById('mapContainer');
        const profileModal = document.getElementById('profileModal');
        const editNameInput = document.getElementById('editNameInput');
        const editColorOptions = document.getElementById('editColorOptions');
        const editAvatarSelector = document.getElementById('editAvatarSelector');
        let currentEditColor = userColor;
        let currentEditAvatar = userAvatar;

        // ---------- HILFSFUNKTIONEN ----------
        function showToast(msg, isGood=true) {
            toast.style.opacity = 1; toast.textContent = msg;
            toast.style.background = isGood ? 'var(--primary)' : '#c0392b';
            setTimeout(() => toast.style.opacity = 0, 2500);
        }
        function playBeep(freq, dur=0.1) {
            try { const ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); const osc = ctx.createOscillator(), gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value = freq; gain.gain.value = 0.1; osc.start(); osc.stop(ctx.currentTime + dur); } catch(e) {}
        }
        function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
        function formatDistance(m) { return m < 1000 ? Math.round(m) + ' m' : (m/1000).toFixed(2) + ' km'; }
        function formatTime(s) { const m = Math.floor(s / 60), sec = Math.floor(s % 60); return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`; }
        function formatPace(distM, seconds) { if (distM < 10) return '--'; const minPerKm = seconds / 60 / (distM / 1000); const m = Math.floor(minPerKm), s = Math.floor((minPerKm - m) * 60); return `${m}:${s.toString().padStart(2,'0')}`; }
        function debounce(func, wait) { let timeout; return function(...args) { clearTimeout(timeout); timeout = setTimeout(() => func.apply(this, args), wait); }; }

        // ---------- PERSISTENZ ----------
        function saveState() {
            localStorage.setItem('rc_state_v14', JSON.stringify({
                territories, points: userPoints, energy, lastEnergyUpdate, history: runHistory,
                quests, boostUsedToday, totalKm: totalKmRun, totalConquered, totalDefended,
                achievements, streakDays, stepsToday
            }));
        }
        function loadState() {
            try {
                const data = JSON.parse(localStorage.getItem('rc_state_v14'));
                if (data) {
                    territories = data.territories || [];
                    userPoints = data.points || 0;
                    energy = data.energy ?? CFG.ENERGY_MAX;
                    lastEnergyUpdate = data.lastEnergyUpdate || Date.now();
                    runHistory = data.history || [];
                    quests = data.quests || [];
                    boostUsedToday = data.boostUsedToday || false;
                    totalKmRun = data.totalKm || 0;
                    totalConquered = data.totalConquered || 0;
                    totalDefended = data.totalDefended || 0;
                    achievements = data.achievements || [];
                    streakDays = data.streakDays || 0;
                    stepsToday = data.stepsToday || 0;
                }
            } catch(e) {}
            if (territories.length === 0) generateInitialRivals();
            if (quests.length === 0) generateQuests();
            if (achievements.length === 0) initAchievements();
        }
        function saveProfile() {
            localStorage.setItem('rc_profile', JSON.stringify({name: playerName, color: userColor, avatar: userAvatar, userId}));
            if (userMarker) {
                userMarker.setIcon(L.divIcon({html:`<div style="background:${userColor}; width:16px; height:16px; border-radius:50%; border:2px solid white; box-shadow:0 0 15px ${userColor};"></div>`, iconSize:[16,16]}));
            }
            renderTerritories();
        }
        function loadProfile() {
            try {
                const p = JSON.parse(localStorage.getItem('rc_profile'));
                if (p) { playerName = p.name; userColor = p.color; userAvatar = p.avatar; userId = p.userId; return true; }
            } catch(e) {}
            return false;
        }

        // ---------- INITIALISIERUNG ----------
        function generateInitialRivals() {
            if (!map) return;
            const c = map.getCenter();
            [[0.008,0.012,'#ff4d6d'],[-0.01,0.005,'#9b5de5'],[0.005,-0.015,'#ff9f1c']].forEach((off,i) => {
                const lat = c.lat + off[0], lng = c.lng + off[1];
                const poly = createCirclePolygon(lat, lng, 160 + i*40);
                const area = turf.area(poly);
                const def = Math.min(CFG.MAX_DEFENSE_CAP, Math.floor(area*CFG.BASE_DEFENSE_PER_M2 + 700*CFG.BASE_DEFENSE_PER_M_DIST));
                territories.push({ id: 'rival_'+Date.now()+i, owner: 'rival_'+i, color: off[2], polygon: poly, defense: def, maxDefense: def, createdAt: Date.now()-3600000*(5+i*2), lastDefended: Date.now()-3600000*(3+i), area, customName: `Rivale ${i+1}`, attackHistory: {} });
            });
        }
        function createCirclePolygon(lat, lng, r) { return turf.circle(turf.point([lng, lat]), r, {steps:20, units:'meters'}).geometry; }
        function generateQuests() {
            quests = [
                { id: 'q1', icon: '🏃', desc: 'Laufe 2 km', target: 2000, progress: 0, reward: 100, type: 'distance', claimed: false },
                { id: 'q2', icon: '⚔️', desc: 'Erobere 1 Gebiet', target: 1, progress: 0, reward: 150, type: 'conquer', claimed: false },
                { id: 'q3', icon: '🛡️', desc: 'Verteidige 2 Gebiete', target: 2, progress: 0, reward: 100, type: 'defend', claimed: false },
                { id: 'q4', icon: '🗺️', desc: 'Laufe 5 km', target: 5000, progress: 0, reward: 250, type: 'distance', claimed: false },
            ];
        }
        function initAchievements() {
            achievements = [
                { id: 'km10', name: '10 km', icon: '👟', target: 10, progress: 0, earned: false },
                { id: 'km50', name: '50 km', icon: '🏃', target: 50, progress: 0, earned: false },
                { id: 'conq5', name: 'Eroberer', icon: '⚔️', target: 5, progress: 0, earned: false },
                { id: 'def10', name: 'Verteidiger', icon: '🛡️', target: 10, progress: 0, earned: false },
                { id: 'pts1k', name: '1000 Pts', icon: '⭐', target: 1000, progress: 0, earned: false },
            ];
        }

        // ---------- KARTE ----------
        function initMap() {
            if (map) return;
            map = L.map('map', { zoomControl: false }).setView([48.1351, 11.5820], 14);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
            territoryLayer = L.layerGroup().addTo(map);
            heatLayer = L.heatLayer([], { radius: 20, blur: 15, maxZoom: 17 }).addTo(map);
            landmarkLayer = L.layerGroup().addTo(map);
            map.locate({setView: true, maxZoom: 16, enableHighAccuracy: true});
            map.on('locationfound', e => {
                if (!userMarker) userMarker = L.marker(e.latlng, { icon: L.divIcon({html:`<div style="background:${userColor}; width:16px; height:16px; border-radius:50%; border:2px solid white; box-shadow:0 0 15px ${userColor};"></div>`, iconSize:[16,16]}) }).addTo(map);
                else userMarker.setLatLng(e.latlng);
                map.setView(e.latlng, 14);
                loadLandmarks();
            });
            map.on('moveend', debounce(loadLandmarks, 800));
        }

        async function loadLandmarks() {
            if (!map) return;
            const bounds = map.getBounds();
            const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;
            const query = `[out:json];(node["amenity"="place_of_worship"](${bbox});node["leisure"="stadium"](${bbox});node["tourism"="attraction"](${bbox});node["historic"="monument"](${bbox}););out body;`;
            try {
                const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
                const data = await res.json();
                landmarks = data.elements.map(el => ({ id: el.id, lat: el.lat, lng: el.lon, name: el.tags.name || el.tags.amenity || el.tags.leisure || 'Wahrzeichen', type: el.tags.amenity || el.tags.leisure || el.tags.tourism || el.tags.historic }));
                renderLandmarks();
            } catch(e) {}
        }

        function renderLandmarks() {
            if (!landmarkLayer) return;
            landmarkLayer.clearLayers();
            landmarks.forEach(lm => L.marker([lm.lat, lm.lng], { icon: L.divIcon({html: '⭐', className: 'landmark-icon', iconSize: [24,24]}) }).bindPopup(`<b>${lm.name}</b><br>${lm.type}`).addTo(landmarkLayer));
        }

        function getContainedLandmarks(polygon) {
            if (!polygon) return [];
            return landmarks.filter(lm => { try { return turf.booleanPointInPolygon(turf.point([lm.lng, lm.lat]), turf.feature(polygon)); } catch(e) { return false; } }).map(lm => lm.id);
        }

        function renderTerritories() {
            if (!territoryLayer) return;
            territoryLayer.clearLayers();
            territories.forEach(t => {
                const hoursOld = (Date.now() - t.lastDefended) / 3600000;
                const isOwn = t.owner === userId;
                const color = isOwn ? userColor : (t.owner.startsWith('rival') ? '#ff4d6d' : '#9b5de5');
                const layer = L.geoJSON(t.polygon, { style: { fillColor: color, color: isOwn ? '#ffffff' : '#333', weight: isOwn ? 2 : 1, fillOpacity: Math.max(0.1, 0.5 - hoursOld / 96 * 0.4) } })
                    .bindPopup(() => {
                        let html = `<b>${isOwn ? 'Dein Gebiet' : 'Fremdes Gebiet'}</b><br>`;
                        if (t.customName) html += `📛 ${t.customName}<br>`;
                        html += `🛡️ ${Math.round(t.defense)} / ${t.maxDefense}<br>📐 ${Math.round(t.area)} m²`;
                        if (isOwn) html += `<br><button class="rename-btn-popup" data-id="${t.id}">✏️ Namen vergeben</button>`;
                        return html;
                    });
                layer.on('popupopen', () => document.querySelectorAll('.rename-btn-popup').forEach(btn => btn.addEventListener('click', (e) => openRenameModal(e.target.dataset.id))));
                layer.addTo(territoryLayer);
            });
            updateStatsUI();
        }

        function updateStatsUI() {
            const myTerrs = territories.filter(t => t.owner === userId);
            const totalArea = myTerrs.reduce((s,t)=>s+(t.area||0),0);
            statArea.innerText = totalArea > 9999 ? Math.round(totalArea/1000)+'k' : Math.round(totalArea);
            statDefense.innerText = Math.round(myTerrs.length ? myTerrs.reduce((s,t)=>s+t.defense,0)/myTerrs.length : 0);
            statPoints.innerText = userPoints;
            heroTotalKm.innerText = totalKmRun.toFixed(1);
        }

        // ---------- FITNESS ----------
        function initStepCounter() {
            if (!window.DeviceMotionEvent) return;
            let lastStepTime = 0;
            window.addEventListener('devicemotion', (event) => {
                const acc = event.accelerationIncludingGravity; if (!acc) return;
                const magnitude = Math.sqrt(acc.x*acc.x + acc.y*acc.y + acc.z*acc.z);
                const now = Date.now();
                if (magnitude > CFG.STEP_THRESHOLD && (now - lastStepTime) > CFG.STEP_MIN_INTERVAL_MS) { stepsToday++; lastStepTime = now; }
            });
        }

        function updateSimulatedHeartRate() {
            if (!isRunning) { heartRate = CFG.HR_BASE; return; }
            const distKm = totalDistance / 1000;
            const elapsedMin = ((Date.now() - runStartTime) / 1000) / 60;
            const pace = distKm > 0.01 ? elapsedMin / distKm : 6.0;
            const paceDiff = Math.max(0, 6.0 - pace);
            heartRate = Math.min(190, Math.floor(CFG.HR_BASE + paceDiff * CFG.HR_PACE_FACTOR * 10 + Math.random() * 4 - 2));
        }

        async function connectBluetoothHR() {
            if (!navigator.bluetooth) { showToast('Bluetooth nicht unterstützt', false); return; }
            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
                btServer = await bluetoothDevice.gatt.connect();
                const service = await btServer.getPrimaryService('heart_rate');
                hrCharacteristic = await service.getCharacteristic('heart_rate_measurement');
                await hrCharacteristic.startNotifications();
                hrCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value; const flags = value.getUint8(0);
                    heartRate = (flags & 0x1) ? value.getUint16(1, true) : value.getUint8(1);
                    heartRateSource = 'bt';
                });
                showToast('✅ Pulsmesser verbunden', true);
            } catch(e) { showToast('Verbindung fehlgeschlagen', false); }
        }

        function calculateCalories(distanceMeters, durationSec, avgHR) {
            const speedKmh = (distanceMeters / 1000) / (durationSec / 3600);
            let met = 8.0;
            if (speedKmh < 8) met = 6.0; else if (speedKmh > 12) met = 12.0;
            return Math.round(met * 70 * (durationSec / 3600));
        }
        // ---------- LAUFLOGIK ----------
        function startRun() {
            if (energy <= 0) { showToast('Keine Energie!', false); return; }
            if (isRunning) return;
            isRunning = true; playBeep(440);
            runStartTime = Date.now();
            currentPath = []; totalDistance = 0;
            mainActionBtn.innerHTML = '<i class="fas fa-stop"></i> STOP';
            mainActionBtn.classList.add('running');
            if (pathLayer) map.removeLayer(pathLayer);
            pathLayer = L.polyline([], {color: userColor, weight: 4}).addTo(map);
            watchId = navigator.geolocation.watchPosition(pos => {
                const lat = pos.coords.latitude, lng = pos.coords.longitude, pt = [lat, lng];
                if (lastPosition) {
                    const dist = turf.distance(turf.point([lastPosition[1], lastPosition[0]]), turf.point([lng, lat]), {units:'meters'});
                    if (dist > 3) { totalDistance += dist; currentPath.push(pt); pathLayer.addLatLng(pt); }
                } else { currentPath.push(pt); pathLayer.addLatLng(pt); }
                lastPosition = pt;
                if (userMarker) userMarker.setLatLng(pt);
                map.setView(pt, map.getZoom());
            }, err => { showToast('GPS Fehler', false); }, { enableHighAccuracy: true });
        }

        function createPolygonFromPath(path) {
            if (path.length < 2) return null;
            const start = path[0], end = path[path.length-1];
            const gap = turf.distance(turf.point([start[1], start[0]]), turf.point([end[1], end[0]]), {units:'meters'});
            const tolerance = Math.min(CFG.MAX_TOLERANCE_M, Math.max(CFG.MIN_TOLERANCE_M, totalDistance * CFG.TOLERANCE_PERCENT));
            let polygonCoords, isClosed = (gap <= tolerance);
            if (isClosed) {
                polygonCoords = [...path];
                if (gap > 0.1) polygonCoords.push(start);
            } else {
                const line = turf.lineString(path.map(p => [p[1], p[0]]));
                const buffered = turf.buffer(line, CFG.LINE_BUFFER_M, {units:'meters'});
                polygonCoords = buffered.geometry.coordinates[0].map(c => [c[1], c[0]]);
            }
            return { polygonCoords, isClosed, gap };
        }

        function calculateAttackPower(baseDist, gap, totalDist, overlapArea, territory, atkMult) {
            let power = baseDist * atkMult;
            const precisionRatio = Math.max(0, 1 - (gap / totalDist));
            power *= 1 + (precisionRatio * (CFG.PRECISION_BONUS_MAX - 1));
            if (territory.polygon) {
                try {
                    const center = turf.centroid(turf.feature(territory.polygon));
                    const attackCenter = turf.centroid(turf.feature(turf.polygon([overlapArea])));
                    const distToCenter = turf.distance(center, attackCenter, {units:'meters'});
                    const maxDist = turf.distance(center, turf.point(territory.polygon.coordinates[0][0]), {units:'meters'});
                    if (distToCenter / maxDist > CFG.WEAK_SPOT_THRESHOLD) { power *= CFG.WEAK_SPOT_MULTIPLIER; showToast('💥 Schwachstelle getroffen!'); }
                } catch(e) {}
            }
            if (territory.defense > CFG.OVERLOAD_THRESHOLD) {
                const excess = territory.defense - CFG.OVERLOAD_THRESHOLD;
                power *= (1 + (excess / 100) * CFG.OVERLOAD_FACTOR);
            }
            if (precisionRatio > 0.95 && Math.random() < CFG.CRIT_CHANCE) { power *= CFG.CRIT_MULTIPLIER; showToast('✨ KRITISCHER TREFFER!'); playBeep(880, 0.2); vibrate(200); }
            return power;
        }

        function processConquest(newPoly, area, dist, atkMult, gap, totalDist) {
            const now = Date.now(); let pts = 0, conquered = false, defended = false;
            const overlapping = territories.filter(t => { try { return turf.booleanIntersects(turf.feature(t.polygon), turf.feature(newPoly)); } catch(e) { return false; } });
            if (overlapping.length === 0) {
                const def = Math.min(CFG.MAX_DEFENSE_CAP, Math.floor(area*CFG.BASE_DEFENSE_PER_M2 + dist*CFG.BASE_DEFENSE_PER_M_DIST));
                const newTerr = { id: 'u_'+Date.now(), owner: userId, color: userColor, polygon: newPoly.geometry, defense: def, maxDefense: def, createdAt: now, lastDefended: now, area, landmarkIds: getContainedLandmarks(newPoly.geometry), attackHistory: {} };
                if (newTerr.landmarkIds.length > 0) { newTerr.defense = Math.floor(newTerr.defense * CFG.LANDMARK_DEFENSE_BONUS); newTerr.maxDefense = newTerr.defense; pts += CFG.LANDMARK_POINTS; showToast(`🏛️ Wahrzeichen erobert! +${CFG.LANDMARK_POINTS} Pts`); }
                territories.push(newTerr); pts += Math.floor(area/12) + Math.floor(dist*0.4); showToast(`🗺️ Neues Gebiet! +${Math.round(area)} m²`);
            } else {
                overlapping.forEach(t => {
                    let overlapArea = 0;
                    try { const inter = turf.intersect(turf.featureCollection([turf.feature(t.polygon), turf.feature(newPoly)])); if (inter) overlapArea = turf.area(inter); } catch(e) {}
                    if (t.owner === userId) {
                        const boost = Math.floor(overlapArea*0.05 + dist*0.2); t.defense = Math.min(t.maxDefense, t.defense + boost); t.lastDefended = now; pts += 10; defended = true; showToast(`🛡️ Verteidigt! +${boost} Def.`);
                    } else {
                        const attackPower = calculateAttackPower(dist, gap, totalDist, overlapArea, t, atkMult);
                        const before = t.defense; t.defense = Math.max(0, t.defense - attackPower * (overlapArea/area)); const damage = before - t.defense; pts += Math.floor(damage * 2) + 15;
                        const lastAttack = t.attackHistory?.[userId] || 0; if (now - lastAttack < CFG.COMBO_TIMEOUT_HOURS * 3600000) { pts += 25; showToast(`🔥 Combo-Angriff! +25 Pts`); }
                        t.attackHistory = t.attackHistory || {}; t.attackHistory[userId] = now;
                        if (t.defense <= 0) {
                            t.owner = userId; t.color = userColor; t.defense = Math.min(CFG.MAX_DEFENSE_CAP, Math.floor(overlapArea*CFG.BASE_DEFENSE_PER_M2+60)); t.maxDefense = t.defense; t.lastDefended = now;
                            const lms = getContainedLandmarks(t.polygon); if (lms.length > 0) { t.defense = Math.floor(t.defense * CFG.LANDMARK_DEFENSE_BONUS); t.maxDefense = t.defense; pts += CFG.LANDMARK_POINTS; showToast(`🏛️ Wahrzeichen erobert! +${CFG.LANDMARK_POINTS} Pts`); }
                            pts += 200; conquered = true; [660,880,1100].forEach((f,i)=>setTimeout(()=>playBeep(f,0.1), i*80)); showToast('🔥 GEBIET EROBERT! +200 Pts'); vibrate([100, 50, 100]);
                        } else { t.lastDefended = now; showToast(`⚔️ Angriff! -${Math.round(damage)} Vert.`, false); }
                    }
                });
            }
            territories = territories.filter(t => t.defense > 0 && (t.owner===userId || (Date.now()-t.lastDefended)<CFG.MAX_AGE_HOURS*3600000));
            return { pts, conquered, defended };
        }

        function stopRun() {
            if (!isRunning) return;
            isRunning = false; navigator.geolocation.clearWatch(watchId);
            mainActionBtn.innerHTML = '<i class="fas fa-play"></i> START';
            mainActionBtn.classList.remove('running');
            playBeep(330);
            const elapsed = Math.floor((Date.now() - runStartTime) / 1000);
            runElapsedSeconds = elapsed;
            if (currentPath.length < 3 || totalDistance < CFG.MIN_DISTANCE_M) { showToast(`Zu kurz – min. ${CFG.MIN_DISTANCE_M}m`, false); if(pathLayer) map.removeLayer(pathLayer); currentPath = []; totalDistance = 0; return; }
            const polyData = createPolygonFromPath(currentPath); if (!polyData) return;
            const { polygonCoords, gap } = polyData;
            const polyGeom = turf.polygon([polygonCoords.map(p => [p[1], p[0]])]); const area = turf.area(polyGeom);
            energy = Math.max(0, energy - 1);
            const precisionRatio = Math.max(0, 1 - (gap / totalDistance)); const precisionFactor = 1 + (precisionRatio * (CFG.PRECISION_BONUS_MAX - 1));
            let atkMult = (boostActive ? CFG.ATTACK_MULTIPLIER * 2.2 : CFG.ATTACK_MULTIPLIER) * precisionFactor; boostActive = false;
            const result = processConquest(polyGeom, area, totalDistance, atkMult, gap, totalDistance);
            userPoints += result.pts;
            const kcal = calculateCalories(totalDistance, elapsed, heartRate);
            const record = { date: Date.now(), distance: totalDistance, area, path: currentPath.filter((_,i)=>i%3===0), conquered: result.conquered, defended: result.defended, duration: elapsed, pts: result.pts, gap, precisionBonus: precisionFactor, avgHR: heartRate, kcal };
            runHistory.push(record); if (runHistory.length > 25) runHistory.shift();
            totalKmRun += totalDistance / 1000; if (result.conquered) totalConquered++; if (result.defended) totalDefended++;
            updateQuests(record); updateAchievements();
            if(pathLayer) map.removeLayer(pathLayer); currentPath = []; totalDistance = 0;
            saveState(); updateUI(); showPostRunModal(record);
        }

        function updateQuests(rec) {
            quests.forEach(q => {
                if (q.claimed) return;
                if (q.type === 'distance') q.progress = Math.min(q.target, q.progress + rec.distance);
                if (q.type === 'conquer' && rec.conquered) q.progress++;
                if (q.type === 'defend' && rec.defended) q.progress++;
                if (q.progress >= q.target) { q.claimed = true; userPoints += q.reward; showToast(`✅ Quest: ${q.desc} +${q.reward} Pts`); }
            });
        }

        function updateAchievements() {
            achievements.forEach(a => {
                let prog = 0;
                if (a.id === 'km10') prog = totalKmRun;
                else if (a.id === 'km50') prog = totalKmRun;
                else if (a.id === 'conq5') prog = totalConquered;
                else if (a.id === 'def10') prog = totalDefended;
                else if (a.id === 'pts1k') prog = userPoints;
                a.progress = prog;
                if (!a.earned && prog >= a.target) { a.earned = true; userPoints += 200; showToast(`🏆 Erfolg: ${a.name}! +200 Pts`); }
            });
        }

        function showPostRunModal(rec) {
            document.getElementById('postRunPoints').innerText = `+${rec.pts}`;
            const statsDiv = document.getElementById('postRunStats');
            statsDiv.innerHTML = `
                <div class="stat-item"><div class="value">${formatDistance(rec.distance)}</div><div class="label">Distanz</div></div>
                <div class="stat-item"><div class="value">${formatTime(rec.duration)}</div><div class="label">Zeit</div></div>
                <div class="stat-item"><div class="value">${formatPace(rec.distance, rec.duration)}</div><div class="label">Pace</div></div>
                <div class="stat-item"><div class="value">${Math.round(rec.area)}</div><div class="label">m²</div></div>
            `;
            const songContainer = document.getElementById('songContainer');
            songContainer.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:14px;color:var(--text-muted);"><div class="spinner"></div> Song wird analysiert...</div>`;
            setTimeout(() => {
                const song = getFallbackSong(rec.distance, rec.duration);
                songContainer.innerHTML = `
                    <div class="song-card" style="background:linear-gradient(135deg,#16002a,#0d001a); border:1px solid rgba(193,232,255,0.18); border-radius:18px; padding:18px 16px; margin:16px 0;">
                        <div style="font-size:0.65rem;text-transform:uppercase;color:var(--accent);margin-bottom:8px;">🎵 Dein Lauf-Song</div>
                        <div style="font-family:'Inter',sans-serif;font-size:1.4rem;font-weight:700;">${song.title}</div>
                        <div style="color:var(--text-muted);font-size:0.8rem;margin-bottom:8px;">${song.artist} · ${song.genre} · ${song.bpm} BPM</div>
                        <div style="display:inline-block;background:rgba(193,232,255,0.08);border:1px solid rgba(193,232,255,0.18);border-radius:30px;padding:4px 12px;font-size:0.75rem;color:var(--accent);">${song.vibe}</div>
                        <div style="font-size:0.78rem;color:var(--text-muted);margin-top:12px;border-top:1px solid var(--glass-border);padding-top:10px;">${song.reason}</div>
                    </div>
                `;
            }, 1200);
            document.getElementById('postRunModal').style.display = 'flex';
        }

        function getFallbackSong(dist, sec) {
            const songs = [
                { title: 'Eye of the Tiger', artist: 'Survivor', genre: 'Rock', bpm: 109, vibe: '💪 Klassisch · Stark', reason: 'Dein Lauf hatte die unnachgiebige Energie dieses Klassikers.' },
                { title: 'Titanium', artist: 'David Guetta ft. Sia', genre: 'Electronic', bpm: 126, vibe: '⚡ Unzerstörbar', reason: 'Mit deiner Pace hast du bewiesen: nichts kann dich stoppen.' },
                { title: 'Harder Better Faster Stronger', artist: 'Daft Punk', genre: 'Electronic', bpm: 123, vibe: '🤖 Rhythmisch · Präzise', reason: 'Deine gleichmäßige Pace war wie ein perfekter Rhythmus.' },
                { title: 'Run the World', artist: 'Beyoncé', genre: 'Pop', bpm: 130, vibe: '🔥 Dominant · Siegreich', reason: 'Heute gehören die Straßen dir.' },
                { title: 'Blinding Lights', artist: 'The Weeknd', genre: 'Synthpop', bpm: 171, vibe: '🌃 Fließend · Frei', reason: 'Dein Lauf hatte den freien Flow dieses Synthpop-Hits.' },
            ];
            return songs[Math.floor(Math.random() * songs.length)];
        }

        function openRenameModal(id) {
            selectedTerritoryId = id;
            const t = territories.find(t => t.id === id);
            document.getElementById('renameInput').value = t?.customName || '';
            document.getElementById('renameModal').style.display = 'flex';
        }
        // ---------- DRAWER & KALENDER ----------
        function renderCalendar() {
            const year = calendarCurrentDate.getFullYear();
            const month = calendarCurrentDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDayOfWeek = (firstDay.getDay() + 6) % 7;
            const daysInMonth = lastDay.getDate();
            
            let html = `<div class="calendar">`;
            html += `<div class="calendar-header">`;
            html += `<button class="tab-btn" id="prevMonth"><i class="fas fa-chevron-left"></i></button>`;
            html += `<span>${firstDay.toLocaleString('de', { month: 'long', year: 'numeric' })}</span>`;
            html += `<button class="tab-btn" id="nextMonth"><i class="fas fa-chevron-right"></i></button>`;
            html += `</div>`;
            
            const weekdays = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
            html += `<div class="calendar-grid">`;
            weekdays.forEach(d => html += `<div class="calendar-day" style="background:transparent; color:var(--text-muted);">${d}</div>`);
            
            for (let i = 0; i < startDayOfWeek; i++) html += `<div class="calendar-day other-month"></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const date = new Date(year, month, d);
                const dateStr = date.toDateString();
                const runsOnDay = runHistory.filter(r => new Date(r.date).toDateString() === dateStr);
                html += `<div class="calendar-day ${runsOnDay.length > 0 ? 'has-run' : ''}" data-date="${dateStr}">${d}</div>`;
            }
            html += `</div><div id="dayDetail" class="day-detail">Wähle einen Tag</div></div>`;
            
            drawerContent.innerHTML = html;
            
            document.getElementById('prevMonth').addEventListener('click', () => { calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() - 1); renderCalendar(); });
            document.getElementById('nextMonth').addEventListener('click', () => { calendarCurrentDate.setMonth(calendarCurrentDate.getMonth() + 1); renderCalendar(); });
            document.querySelectorAll('.calendar-day[data-date]').forEach(el => {
                el.addEventListener('click', () => {
                    const dateStr = el.dataset.date;
                    const runs = runHistory.filter(r => new Date(r.date).toDateString() === dateStr);
                    const detailDiv = document.getElementById('dayDetail');
                    detailDiv.innerHTML = runs.length === 0 ? 'Keine Läufe an diesem Tag.' : runs.map(r => `
                        <div style="margin-bottom:6px;">
                            <span style="color:var(--accent);">${formatDistance(r.distance)}</span> · ${formatTime(r.duration)} · ${Math.round(r.area)}m²
                        </div>
                    `).join('');
                });
            });
        }

        function renderDrawer() {
            let html = '';
            if (currentTab === 'history') {
                html = runHistory.slice(-8).reverse().map(r => `
                    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--glass-border);">
                        <div style="font-size:1.2rem;">${r.conquered ? '⚔️' : (r.defended ? '🛡️' : '🏃')}</div>
                        <div style="flex:1;">
                            <div style="font-weight:700;color:var(--accent);">${formatDistance(r.distance)}</div>
                            <div style="font-size:0.7rem;color:var(--text-muted);">${new Date(r.date).toLocaleDateString('de')} · ${formatTime(r.duration)} · ${Math.round(r.area)}m²</div>
                        </div>
                        <div style="font-weight:700;color:var(--accent);">+${r.pts}</div>
                    </div>
                `).join('') || '<div class="muted">Noch keine Läufe</div>';
            } else if (currentTab === 'quests') {
                html = quests.map(q => {
                    const pct = Math.min(100, Math.round(q.progress/q.target*100));
                    return `
                        <div style="background:var(--card-bg);border-radius:14px;padding:12px;margin-bottom:8px;">
                            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                                <span style="font-size:1.2rem;">${q.icon}</span>
                                <span style="flex:1;font-weight:600;color:${q.progress>=q.target?'var(--accent)':'white'}">${q.desc}</span>
                                <span style="font-weight:700;color:var(--accent);">🎁 ${q.reward}</span>
                            </div>
                            <div style="font-size:0.7rem;color:var(--text-muted);">${Math.round(q.progress)} / ${q.target}</div>
                            <div style="height:4px;background:rgba(255,255,255,0.08);border-radius:4px;margin-top:4px;">
                                <div style="height:100%;width:${pct}%;background:var(--primary);border-radius:4px;"></div>
                            </div>
                        </div>
                    `;
                }).join('');
            } else if (currentTab === 'terr') {
                const myTerrs = territories.filter(t => t.owner === userId);
                html = myTerrs.map(t => `
                    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--glass-border);">
                        <div style="width:10px;height:10px;border-radius:50%;background:${userColor};"></div>
                        <div style="flex:1;cursor:pointer;" onclick="window.flyToTerritory('${t.id}')">${t.customName || 'Unbenannt'}</div>
                        <div style="font-size:0.7rem;color:var(--text-muted);">${Math.round(t.area)}m²</div>
                        <button onclick="window.openRenameModal('${t.id}')" style="background:none;border:none;color:var(--text-muted);cursor:pointer;">✏️</button>
                    </div>
                `).join('') || '<div class="muted">Noch keine eigenen Gebiete</div>';
            } else if (currentTab === 'fitness') {
                const distKm = (totalDistance/1000).toFixed(2);
                const hrDisplay = heartRateSource === 'bt' ? `${heartRate} ❤️` : `${heartRate} (sim)`;
                const kcalToday = fitnessData.totalKcal || Math.round(totalKmRun * 65);
                html = `
                    <div class="fitness-grid">
                        <div class="stat-item"><div class="value">${formatTime(runElapsedSeconds)}</div><div class="label">Laufzeit</div></div>
                        <div class="stat-item"><div class="value">${distKm}</div><div class="label">km (aktuell)</div></div>
                        <div class="stat-item"><div class="value">${stepsToday}</div><div class="label">Schritte</div></div>
                        <div class="stat-item"><div class="value">${hrDisplay}</div><div class="label">Puls bpm</div></div>
                        <div class="stat-item"><div class="value">${formatPace(totalDistance, runElapsedSeconds)}</div><div class="label">Pace</div></div>
                        <div class="stat-item"><div class="value">${streakDays}</div><div class="label">🔥 Streak</div></div>
                        <div class="stat-item"><div class="value">${totalKmRun.toFixed(1)}</div><div class="label">Gesamt km</div></div>
                        <div class="stat-item"><div class="value">${kcalToday}</div><div class="label">kcal</div></div>
                    </div>
                    <button class="btn bluetooth-btn" id="connectHRBtn" style="margin-top:16px; width:100%;">
                        <i class="fas fa-heartbeat"></i> Pulsmesser koppeln
                    </button>
                `;
                drawerContent.innerHTML = html;
                document.getElementById('connectHRBtn')?.addEventListener('click', connectBluetoothHR);
                return;
            } else if (currentTab === 'ach') {
                html = achievements.map(a => `
                    <div style="display:inline-block;margin:4px;background:${a.earned?'rgba(84,131,179,0.2)':'var(--card-bg)'};border:1px solid ${a.earned?'var(--primary)':'var(--glass-border)'};border-radius:12px;padding:8px 14px;font-size:0.8rem;color:${a.earned?'var(--accent)':'var(--text-muted)'};">
                        ${a.icon} ${a.name} ${a.earned?'✓':Math.round(a.progress)+'/'+a.target}
                    </div>
                `).join('');
            } else if (currentTab === 'calendar') {
                renderCalendar();
                return;
            }
            drawerContent.innerHTML = html;
        }

        window.flyToTerritory = function(id) {
            const t = territories.find(t => t.id === id);
            if (t && t.polygon) {
                const coords = turf.centroid(turf.feature(t.polygon)).geometry.coordinates;
                map.setView([coords[1], coords[0]], 16);
                mapContainer.style.display = 'block';
                drawer.style.display = 'none';
                drawer.classList.remove('visible');
            }
        };
        window.openRenameModal = openRenameModal;

        function updateUI() {
            updateStatsUI();
            renderTerritories();
            const todayStr = new Date().toDateString();
            const todayRuns = runHistory.filter(r => new Date(r.date).toDateString() === todayStr);
            const distToday = todayRuns.reduce((s,r) => s + r.distance, 0) / 1000;
            const timeToday = todayRuns.reduce((s,r) => s + r.duration, 0);
            todayDistance.innerText = distToday.toFixed(1);
            todayTime.innerText = formatTime(timeToday);
            todayPace.innerText = distToday > 0 ? formatPace(distToday*1000, timeToday) : '--';
            dashCalories.innerText = Math.round(totalKmRun * 65);
            dashSteps.innerText = stepsToday;
            heroTotalKm.innerText = totalKmRun.toFixed(1);
        }

        function openProfileModal() {
            editNameInput.value = playerName;
            currentEditColor = userColor;
            currentEditAvatar = userAvatar;
            renderEditColorOptions();
            renderEditAvatarOptions();
            profileModal.style.display = 'flex';
        }

        function renderEditColorOptions() {
            editColorOptions.innerHTML = '';
            COLORS.forEach(c => {
                const d = document.createElement('div');
                d.className = 'color-option' + (c === currentEditColor ? ' selected' : '');
                d.style.background = c;
                d.dataset.color = c;
                d.addEventListener('click', () => {
                    document.querySelectorAll('#editColorOptions .color-option').forEach(o => o.classList.remove('selected'));
                    d.classList.add('selected');
                    currentEditColor = c;
                });
                editColorOptions.appendChild(d);
            });
        }

        function renderEditAvatarOptions() {
            editAvatarSelector.innerHTML = '';
            AVATARS.forEach(a => {
                const s = document.createElement('span');
                s.className = 'avatar-option' + (a === currentEditAvatar ? ' selected' : '');
                s.dataset.avatar = a;
                s.innerText = a;
                s.addEventListener('click', () => {
                    document.querySelectorAll('#editAvatarSelector .avatar-option').forEach(o => o.classList.remove('selected'));
                    s.classList.add('selected');
                    currentEditAvatar = a;
                });
                editAvatarSelector.appendChild(s);
            });
        }

        // ---------- INITIALISIERUNG ----------
        (function initApp() {
            const colorDiv = document.getElementById('colorOptions');
            COLORS.forEach(c => { const d = document.createElement('div'); d.className = 'color-option' + (c===userColor?' selected':''); d.style.background=c; d.dataset.color=c; colorDiv.appendChild(d); });
            const avatarDiv = document.getElementById('avatarSelector');
            AVATARS.forEach(a => { const s = document.createElement('span'); s.className = 'avatar-option' + (a===userAvatar?' selected':''); s.dataset.avatar=a; s.innerText=a; avatarDiv.appendChild(s); });
            document.querySelectorAll('.color-option').forEach(o => o.addEventListener('click', function(){ document.querySelectorAll('.color-option').forEach(c => c.classList.remove('selected')); this.classList.add('selected'); userColor = this.dataset.color; }));
            document.querySelectorAll('.avatar-option').forEach(o => o.addEventListener('click', function(){ document.querySelectorAll('.avatar-option').forEach(a => a.classList.remove('selected')); this.classList.add('selected'); userAvatar = this.dataset.avatar; }));

            document.getElementById('startAppBtn').addEventListener('click', () => {
                const name = document.getElementById('playerNameInput').value.trim() || 'Läufer'+Math.floor(Math.random()*9000+1000);
                playerName = name; userId = 'u_'+name.replace(/\s/g,'_');
                saveProfile();
                document.getElementById('onboarding').style.display = 'none'; document.getElementById('mainApp').style.display = 'flex';
                initMap(); loadState(); updateUI();
                setInterval(() => { territories = territories.map(t => { if (t.owner === userId) return t; const hours = (Date.now() - t.lastDefended)/3600000; if (hours > 0.1) t.defense = Math.max(0, Math.floor(t.defense * (1 - hours*CFG.DECAY_PERCENT_PER_HOUR))); return t; }).filter(t => t.defense > 0 || t.owner===userId || (Date.now()-t.lastDefended)<CFG.MAX_AGE_HOURS*3600000); renderTerritories(); }, 60000);
                setInterval(() => { if (energy < CFG.ENERGY_MAX && (Date.now()-lastEnergyUpdate) >= CFG.ENERGY_REGEN_HOURS*3600000) { energy = Math.min(CFG.ENERGY_MAX, energy+1); lastEnergyUpdate = Date.now(); } }, 60000);
                setInterval(() => { if (heartRateSource === 'sim') updateSimulatedHeartRate(); }, 3000);
            });

            if (loadProfile()) {
                document.getElementById('onboarding').style.display = 'none'; document.getElementById('mainApp').style.display = 'flex';
                initMap(); loadState(); updateUI();
            }

            mainActionBtn.addEventListener('click', () => { if (isRunning) stopRun(); else startRun(); });
            document.getElementById('mapViewBtn').addEventListener('click', () => { mapContainer.style.display = 'block'; if (!map) initMap(); setTimeout(() => map.invalidateSize(), 100); });
            document.getElementById('closeMapBtn').addEventListener('click', () => { mapContainer.style.display = 'none'; });
            document.getElementById('menuBtn').addEventListener('click', () => { drawer.style.display = 'flex'; drawer.classList.add('visible'); renderDrawer(); });
            document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', function(){ document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); this.classList.add('active'); currentTab = this.dataset.tab; renderDrawer(); }));
            document.getElementById('profileBtn').addEventListener('click', openProfileModal);
            document.getElementById('closeProfileModal').addEventListener('click', () => profileModal.style.display = 'none');
            document.getElementById('saveProfileBtn').addEventListener('click', () => {
                playerName = editNameInput.value.trim() || playerName;
                userColor = currentEditColor; userAvatar = currentEditAvatar;
                saveProfile(); profileModal.style.display = 'none'; showToast('Profil aktualisiert', true);
            });
            document.getElementById('closePostRunModal').addEventListener('click', () => document.getElementById('postRunModal').style.display = 'none');
            document.getElementById('closeRenameModal').addEventListener('click', () => document.getElementById('renameModal').style.display = 'none');
            document.getElementById('saveRenameBtn').addEventListener('click', () => {
                if (selectedTerritoryId) {
                    const t = territories.find(t => t.id === selectedTerritoryId);
                    if (t) { t.customName = document.getElementById('renameInput').value.trim() || null; saveState(); updateUI(); }
                }
                document.getElementById('renameModal').style.display = 'none';
            });
            initStepCounter();
        })();
    })();
</script>
</body>
</html>

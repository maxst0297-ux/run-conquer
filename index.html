<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🏃‍♂️ Run & Conquer · Laufen & Erobern</title>
    
    <!-- Leaflet & Plugins -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
    
    <style>
        /* ---------- FARBPALETTE (Dunkelmodus) ---------- */
        :root {
            --bg-deep: #09090f;
            --bg-dark: #111118;
            --primary: #e8ff47;
            --secondary: #6b6b82;
            --accent: #e8ff47;
            --text-light: #f0f0f8;
            --text-muted: #6b6b82;
            --card-bg: #1a1a26;
            --glass-border: rgba(255,255,255,0.07);
            --nav-indicator: #e8ff47;
        }

        /* ---------- TAG-MODUS (HELL) ---------- */
        body.light-mode {
            --bg-deep: #FDF5E7;
            --bg-dark: #FAE3C4;
            --primary: #D14E30;
            --secondary: #304946;
            --accent: #D14E30;
            --text-light: #04191C;
            --text-muted: #304946;
            --card-bg: #FAE3C4;
            --glass-border: #30494630;
            --nav-indicator: #D14E30;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-deep);
            color: var(--text-light);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.3s, color 0.3s;
        }

        /* Splashscreen */
        #splash {
            position: fixed; inset: 0;
            background: #09090f;
            display: flex; align-items: center; justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s;
        }
        .splash-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4rem;
            letter-spacing: 6px;
            color: #e8ff47;
            text-shadow: 0 0 20px rgba(232,255,71,0.5);
            animation: fadePulse 1s infinite alternate;
        }
        @keyframes fadePulse {
            from { opacity: 0.7; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Onboarding */
        #onboarding {
            position: fixed; inset: 0; background: var(--bg-deep);
            display: flex; align-items: center; justify-content: center;
            z-index: 2000; padding: 20px;
        }
        .onboarding-card {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 36px 28px; max-width: 400px; width: 100%;
            text-align: center;
        }
        .onboarding-title {
            font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; letter-spacing: 2px;
            color: var(--primary); line-height: 1; margin-bottom: 8px;
        }
        .onboarding-sub {
            color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 3px;
            margin-bottom: 32px;
        }
        .input-group { margin-bottom: 24px; text-align: left; }
        .input-group label {
            font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;
            color: var(--text-muted); margin-bottom: 8px; display: block;
        }
        .input-group input {
            width: 100%; padding: 14px 18px; font-size: 1rem;
            background: var(--bg-dark); border: 1px solid var(--glass-border);
            border-radius: 14px; color: var(--text-light); outline: none;
        }
        .color-options { display: flex; gap: 12px; margin-top: 8px; }
        .color-option {
            width: 40px; height: 40px; border-radius: 40px; cursor: pointer;
            border: 3px solid transparent; transition: 0.15s;
        }
        .color-option.selected { border-color: var(--text-light); transform: scale(1.15); }
        .avatar-selector { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
        .avatar-option {
            font-size: 2rem; cursor: pointer; padding: 6px 10px; border-radius: 12px;
            background: var(--bg-dark); border: 2px solid transparent; transition: 0.15s;
        }
        .avatar-option.selected { border-color: var(--primary); background: var(--card-bg); }
        .btn-start {
            background: var(--primary); color: var(--bg-deep); border: none; padding: 18px 24px;
            border-radius: 16px; font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem;
            letter-spacing: 2px; width: 100%; cursor: pointer; margin-top: 8px;
        }

        /* Haupt-App */
        #mainApp { display: none; flex-direction: column; height: 100%; position: relative; }
        .app-header {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--bg-deep);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            height: 60px;
        }
        .app-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 2px; color: var(--primary); }
        .user-badge {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
            cursor: pointer;
        }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            font-size: 1.1rem;
            color: var(--primary);
            width: 40px;
            height: 40px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        #screenContainer {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 80px;
            overflow: hidden;
        }
        .view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            transform: translateX(20px);
            pointer-events: none;
        }
        .view.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        /* Karten-View */
        #mapView { padding: 0; }
        #map { height: 100%; width: 100%; z-index: 1; }

        #controlPanel {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: var(--bg-dark); backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border); border-radius: 24px 24px 0 0;
            padding: 16px 16px 20px; z-index: 1500;
            transform: translateY(100%); transition: transform 0.3s ease;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
        }
        #controlPanel.visible { transform: translateY(0); }

        #togglePanelBtn {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: var(--bg-deep);
            width: 48px; height: 48px; border-radius: 30px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; cursor: pointer; z-index: 1600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: bottom 0.3s ease, opacity 0.2s;
        }
        #controlPanel.visible ~ #togglePanelBtn { bottom: calc(100% - 24px); }
        #controlPanel.visible ~ #togglePanelBtn i { transform: rotate(180deg); }

        .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 8px 10px; text-align: center;
        }
        .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--primary); }
        .stat-label { font-size: 0.6rem; text-transform: uppercase; color: var(--text-muted); }
        .action-buttons { display: flex; gap: 8px; }
        .btn {
            flex: 1; border: none; background: var(--card-bg); color: var(--text-light);
            border: 1px solid var(--glass-border); padding: 14px 10px;
            border-radius: 14px; font-family: 'Bebas Neue', sans-serif; font-size: 1rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--primary); color: var(--bg-deep); border: none; }
        .btn:disabled { opacity: 0.4; pointer-events: none; }
        .live-indicator {
            display: flex; align-items: center; gap: 8px; background: var(--card-bg);
            border: 1px solid var(--glass-border); border-radius: 40px;
            padding: 6px 14px; margin-bottom: 10px; font-size: 0.8rem;
        }
        .blink-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
        .running .blink-dot { background: #10b981; box-shadow: 0 0 8px #10b981; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* Dashboard (Aktivität) */
        .hero-stat { text-align: center; margin-bottom: 30px; }
        .hero-value { font-size: 5rem; font-weight: 800; color: var(--primary); }
        .activity-summary {
            background: linear-gradient(135deg, var(--bg-dark), var(--primary));
            border-radius: 28px; padding: 24px; margin-bottom: 24px;
        }
        .activity-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); }
        .activity-stats { display: flex; justify-content: space-around; margin: 20px 0; }
        .activity-stat .value { font-size: 2rem; font-weight: 800; }
        .today-activity { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg-deep); border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; align-items: center;
            padding: 8px 16px; height: 80px; z-index: 500;
        }
        .nav-list {
            display: flex; width: 100%; justify-content: space-around;
            list-style: none; position: relative;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-muted); font-size: 0.7rem; cursor: pointer;
            transition: color 0.3s; z-index: 2; padding: 8px 0;
        }
        .nav-item i { font-size: 1.5rem; }
        .nav-item.active { color: var(--primary); }
        .nav-indicator {
            position: absolute; bottom: 8px; left: 0; height: 4px;
            background: var(--nav-indicator); border-radius: 4px;
            transition: left 0.3s ease, width 0.3s ease; width: 0;
        }

        /* Drawer */
        #drawer {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-dark);
            border-top: 1px solid var(--glass-border); border-radius: 24px 24px 0 0;
            z-index: 2000; max-height: 75vh; overflow-y: auto; display: none;
            flex-direction: column; transform: translateY(100%); transition: transform 0.3s;
        }
        #drawer.visible { transform: translateY(0); }
        .drawer-handle { width: 36px; height: 4px; background: var(--glass-border); border-radius: 4px; margin: 12px auto 0; }
        .drawer-tabs {
            display: flex; gap: 4px; padding: 12px 16px 0; overflow-x: auto;
            position: relative;
        }
        .tab-btn {
            padding: 7px 14px; border-radius: 40px; border: none; background: var(--card-bg);
            color: var(--text-muted); font-weight: 600; font-size: 0.75rem; cursor: pointer;
            white-space: nowrap; transition: all 0.2s; position: relative; z-index: 2;
        }
        .tab-btn.active { background: var(--primary); color: var(--bg-deep); }
        .drawer-indicator {
            position: absolute; bottom: 0; left: 0; height: 3px;
            background: var(--nav-indicator); border-radius: 3px;
            transition: left 0.3s ease, width 0.3s ease; width: 0; z-index: 1;
        }
        .drawer-content {
            padding: 16px 16px 28px;
            transition: opacity 0.2s;
        }
        .drawer-content.fade-out { opacity: 0; }
        .drawer-content.fade-in { opacity: 1; }

        /* Modals */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center; z-index: 4000; padding: 20px;
        }
        .modal-card {
            background: var(--bg-dark); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 24px; max-width: 380px; width: 100%;
            max-height: 80vh; overflow-y: auto; color: var(--text-light);
        }
        .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; margin-bottom: 16px; }
        .modal-input {
            width: 100%; padding: 14px; background: var(--card-bg);
            border: 1px solid var(--glass-border); border-radius: 14px;
            color: var(--text-light); font-size: 1rem; margin-bottom: 16px; outline: none;
        }
        .modal-actions { display: flex; gap: 10px; }

        #toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: var(--primary); color: var(--bg-deep); padding: 10px 20px;
            border-radius: 40px; z-index: 5000; opacity: 0; transition: 0.2s;
            pointer-events: none; white-space: nowrap; font-size: 0.85rem; font-weight: 600;
        }

        /* Kalender */
        .calendar { background: var(--card-bg); border-radius: 20px; padding: 16px; }
        .calendar-day { background: var(--bg-dark); color: var(--text-light); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 0.9rem; cursor: pointer; }
        .calendar-day.has-run { background: var(--primary); color: var(--bg-deep); font-weight: 700; }
        .calendar-day.today { border: 2px solid var(--primary); }
        .day-detail { margin-top: 20px; padding: 16px; background: var(--card-bg); border-radius: 16px; }
        .fitness-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .muted { color: var(--text-muted); }
        .bluetooth-btn { background: var(--card-bg); border: 1px solid var(--primary); color: var(--primary); }
    </style>
</head>
<body>

<!-- SPLASHSCREEN -->
<div id="splash"><div class="splash-title">RUN & CONQUER</div></div>

<!-- ONBOARDING -->
<div id="onboarding" style="display: none;">
    <div class="onboarding-card">
        <div class="onboarding-title">RUN & CONQUER</div>
        <div class="onboarding-sub">Lauf · Erobere · Verteidige</div>
        <div class="input-group">
            <label>Dein Name</label>
            <input type="text" id="playerNameInput" placeholder="z.B. SpeedRunner">
        </div>
        <div class="input-group">
            <label>Farbe</label>
            <div class="color-options" id="colorOptions"></div>
        </div>
        <div class="input-group">
            <label>Avatar</label>
            <div class="avatar-selector" id="avatarSelector"></div>
        </div>
        <button class="btn-start" id="startAppBtn">LOS GEHT'S →</button>
    </div>
</div>

<!-- HAUPT-APP -->
<div id="mainApp" style="display: none;">
    <div class="app-header">
        <div class="app-title">RUN & CONQUER</div>
        <div class="user-badge" id="userBadge">
            <span id="userAvatar">🏃</span> <span id="displayName">Läufer</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="shareBtn"><i class="fas fa-share-alt"></i></button>
            <button class="icon-btn" id="themeToggle"><i class="fas fa-sun"></i></button>
            <button class="icon-btn" id="settingsBtn"><i class="fas fa-cog"></i></button>
            <button class="icon-btn" id="drawerToggle"><i class="fas fa-chart-bar"></i></button>
        </div>
    </div>

    <div id="screenContainer">
        <!-- KARTEN-VIEW -->
        <div id="mapView" class="view active">
            <div id="map"></div>
            <div id="controlPanel">
                <div class="stats-row">
                    <div class="stat-card"><div class="stat-value" id="pointsValue">0</div><div class="stat-label">Punkte</div></div>
                    <div class="stat-card"><div class="stat-value" id="areaValue">0</div><div class="stat-label">m²</div></div>
                    <div class="stat-card"><div class="stat-value" id="defenseValue">0</div><div class="stat-label">Vert.</div></div>
                </div>
                <div class="live-indicator" id="runStatus">
                    <span class="blink-dot" id="statusDot"></span>
                    <span id="statusText">Bereit</span>
                    <span id="distanceLive" style="margin-left: auto;"></span>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-primary" id="startRunBtn"><i class="fas fa-play"></i> START</button>
                    <button class="btn" id="stopRunBtn" disabled><i class="fas fa-stop"></i> STOP</button>
                    <button class="btn" id="fitnessBtn"><i class="fas fa-heart"></i> FITNESS</button>
                </div>
            </div>
            <div id="togglePanelBtn"><i class="fas fa-chevron-up"></i></div>
        </div>

        <!-- AKTIVITÄT-VIEW (Dashboard) -->
        <div id="dashboardView" class="view">
            <div class="hero-stat">
                <div class="hero-value" id="heroTotalKm">0.0</div>
                <div class="stat-label">Gesamtkilometer</div>
            </div>
            <div class="activity-summary">
                <div class="activity-title">Heutige Aktivität</div>
                <div class="activity-stats">
                    <div class="activity-stat"><span class="value" id="todayDistance">0.0</span><span class="label">km</span></div>
                    <div class="activity-stat"><span class="value" id="todayTime">00:00</span><span class="label">Zeit</span></div>
                    <div class="activity-stat"><span class="value" id="todayPace">--</span><span class="label">Pace</span></div>
                </div>
            </div>
            <div class="today-activity">
                <div class="stat-card"><div class="stat-value" id="dashCalories">0</div><div class="stat-label">Kalorien</div></div>
                <div class="stat-card"><div class="stat-value" id="dashSteps">0</div><div class="stat-label">Schritte</div></div>
            </div>
            <div style="margin-top:20px;">
                <h3>Quests</h3>
                <div id="dashQuests"></div>
            </div>
            <canvas id="weeklyChart" width="300" height="120" style="margin-top:20px;"></canvas>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <ul class="nav-list" id="bottomNav">
            <li class="nav-item active" data-view="map"><i class="fas fa-map"></i><span>Karte</span></li>
            <li class="nav-item" data-view="dashboard"><i class="fas fa-chart-pie"></i><span>Aktivität</span></li>
            <li class="nav-item" data-view="profile"><i class="fas fa-user"></i><span>Profil</span></li>
            <div class="nav-indicator" id="navIndicator"></div>
        </ul>
    </nav>

    <!-- DRAWER -->
    <div id="drawer">
        <div class="drawer-handle"></div>
        <div class="drawer-tabs" id="drawerTabs">
            <button class="tab-btn active" data-tab="history">Läufe</button>
            <button class="tab-btn" data-tab="quests">Quests</button>
            <button class="tab-btn" data-tab="terr">Gebiete</button>
            <button class="tab-btn" data-tab="fitness">Fitness</button>
            <button class="tab-btn" data-tab="ach">Erfolge</button>
            <button class="tab-btn" data-tab="calendar">Kalender</button>
            <div class="drawer-indicator" id="drawerIndicator"></div>
        </div>
        <div class="drawer-content" id="drawerContent"></div>
    </div>
</div>

<!-- PROFIL MODAL -->
<div id="profileModal" class="modal" style="display: none;">
    <div class="modal-card">
        <div class="modal-title">PROFIL ✏️</div>
        <div class="input-group">
            <label>Name</label>
            <input type="text" id="editNameInput" class="modal-input" placeholder="Dein Name">
        </div>
        <div class="input-group">
            <label>Avatar</label>
            <div class="avatar-selector" id="editAvatarSelector"></div>
        </div>
        <div class="modal-actions">
            <button class="btn btn-primary" id="saveProfileBtn">Speichern</button>
            <button class="btn" id="closeProfileModal">Abbrechen</button>
        </div>
    </div>
</div>

<!-- POST-RUN MODAL -->
<div id="postRunModal" class="modal" style="display: none;">
    <div class="modal-card">
        <div class="modal-title">LAUF BEENDET 🎉</div>
        <div id="postRunStats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px;"></div>
        <div style="text-align: center; background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 16px;">
            <div style="font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; color: var(--primary);" id="postRunPoints">+0</div>
            <div style="color: var(--text-muted);">Punkte verdient</div>
        </div>
        <div id="songContainer"></div>
        <button class="btn btn-primary" id="closePostRunModal" style="width:100%; margin-top:16px;">WEITER →</button>
    </div>
</div>

<!-- RENAME MODAL -->
<div id="renameModal" class="modal" style="display: none;">
    <div class="modal-card">
        <div class="modal-title">GEBIET ✏️</div>
        <input type="text" id="renameInput" class="modal-input" placeholder="Gebietsname eingeben">
        <div class="modal-actions">
            <button class="btn btn-primary" id="saveRenameBtn">Speichern</button>
            <button class="btn" id="closeRenameModal">Abbrechen</button>
        </div>
        <hr style="margin:20px 0; border-color:var(--glass-border);">
        <div id="allTerritoriesList"></div>
    </div>
</div>

<div id="toast"></div>

<script>
    // Splashscreen Timer
    setTimeout(() => {
        document.getElementById('splash').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('splash').style.display = 'none';
            const hasProfile = localStorage.getItem('rc_profile');
            if (hasProfile) {
                document.getElementById('mainApp').style.display = 'flex';

        }
    };

    // ---------- INITIALISIERUNG ----------
    window.initApp = function() {
        renderOnboardingOptions();

        const startAppBtn = document.getElementById('startAppBtn');
        if (startAppBtn) {
            const newBtn = startAppBtn.cloneNode(true);
            startAppBtn.parentNode.replaceChild(newBtn, startAppBtn);
            newBtn.addEventListener('click', () => {
                const nameInput = document.getElementById('playerNameInput');
                const name = (nameInput ? nameInput.value.trim() : '') || 'Läufer' + Math.floor(Math.random() * 9000 + 1000);
                playerName = name;
                userId = 'u_' + name.replace(/\s/g, '_');
                displayNameSpan.innerText = name;
                userAvatarSpan.innerText = userAvatar;
                saveProfile();
                document.getElementById('onboarding').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                initMap();
                setTimeout(() => {
                    loadState();
                    updateUI();
                    if (map) map.invalidateSize();
                }, 150);
                setInterval(() => {
                    territories = territories.map(t => {
                        if (t.owner === userId) return t;
                        const hours = (Date.now() - t.lastDefended) / 3600000;
                        if (hours > 0.1) t.defense = Math.max(0, Math.floor(t.defense * (1 - hours * CFG.DECAY_PERCENT_PER_HOUR)));
                        return t;
                    }).filter(t => t.defense > 0 || t.owner === userId || (Date.now() - t.lastDefended) < CFG.MAX_AGE_HOURS * 3600000);
                    renderTerritories();
                }, 60000);
                setInterval(() => {
                    if (energy < CFG.ENERGY_MAX && (Date.now() - lastEnergyUpdate) >= CFG.ENERGY_REGEN_HOURS * 3600000) {
                        energy = Math.min(CFG.ENERGY_MAX, energy + 1);
                        lastEnergyUpdate = Date.now();
                    }
                }, 60000);
                setInterval(() => {
                    if (heartRateSource === 'sim') updateSimulatedHeartRate();
                }, 3000);
            });
        }

        if (document.getElementById('mainApp').style.display === 'flex') {
            initMap();
            setTimeout(() => {
                loadState();
                updateUI();
                if (map) map.invalidateSize();
            }, 150);
            setInterval(() => {
                territories = territories.map(t => {
                    if (t.owner === userId) return t;
                    const hours = (Date.now() - t.lastDefended) / 3600000;
                    if (hours > 0.1) t.defense = Math.max(0, Math.floor(t.defense * (1 - hours * CFG.DECAY_PERCENT_PER_HOUR)));
                    return t;
                }).filter(t => t.defense > 0 || t.owner === userId || (Date.now() - t.lastDefended) < CFG.MAX_AGE_HOURS * 3600000);
                renderTerritories();
            }, 60000);
            setInterval(() => {
                if (energy < CFG.ENERGY_MAX && (Date.now() - lastEnergyUpdate) >= CFG.ENERGY_REGEN_HOURS * 3600000) {
                    energy = Math.min(CFG.ENERGY_MAX, energy + 1);
                    lastEnergyUpdate = Date.now();
                }
            }, 60000);
            setInterval(() => {
                if (heartRateSource === 'sim') updateSimulatedHeartRate();
            }, 3000);
        }

        startBtn.addEventListener('click', startRun);
        stopBtn.addEventListener('click', stopRun);
        togglePanelBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            controlPanel.classList.toggle('visible');
        });
        document.getElementById('drawerToggle').addEventListener('click', (e) => {
            e.stopPropagation();
            if (drawer.style.display === 'flex') {
                drawer.style.display = 'none';
                drawer.classList.remove('visible');
            } else {
                drawer.style.display = 'flex';
                drawer.classList.add('visible');
                controlPanel.classList.remove('visible');
                renderDrawer();
                updateDrawerIndicator();
            }
        });
        document.getElementById('fitnessBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            currentTab = 'fitness';
            drawer.style.display = 'flex';
            drawer.classList.add('visible');
            controlPanel.classList.remove('visible');
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active');
                if (b.dataset.tab === 'fitness') b.classList.add('active');
            });
            renderDrawer();
            updateDrawerIndicator();
        });
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTab = this.dataset.tab;
                renderDrawer();
                updateDrawerIndicator();
            });
        });
        document.getElementById('settingsBtn').addEventListener('click', () => renameModal.style.display = 'flex');
        document.getElementById('closeRenameModal').addEventListener('click', () => renameModal.style.display = 'none');
        document.getElementById('saveRenameBtn').addEventListener('click', () => {
            if (selectedTerritoryId) {
                const t = territories.find(t => t.id === selectedTerritoryId);
                if (t) { t.customName = renameInput.value.trim() || null; saveState(); updateUI(); }
            }
            renameModal.style.display = 'none';
        });
        document.getElementById('closePostRunModal').addEventListener('click', () => postRunModal.style.display = 'none');
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const icon = document.getElementById('themeToggle').querySelector('i');
            icon.className = document.body.classList.contains('light-mode') ? 'fas fa-moon' : 'fas fa-sun';
            if (map) {
                const isDark = !document.body.classList.contains('light-mode');
                map.eachLayer(l => { if (l instanceof L.TileLayer) map.removeLayer(l); });
                L.tileLayer(isDark ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            }
        });
        document.getElementById('shareBtn').addEventListener('click', async () => {
            try {
                const canvas = await html2canvas(document.getElementById('map-container') || document.getElementById('mapView'));
                const blob = await (await fetch(canvas.toDataURL())).blob();
                const file = new File([blob], 'run-and-conquer.png', { type: 'image/png' });
                if (navigator.share) await navigator.share({ title: 'Run & Conquer', text: `${Math.round(areaEl.innerText)} m² erobert!`, files: [file] });
                else { const a = document.createElement('a'); a.download = 'map.png'; a.href = canvas.toDataURL(); a.click(); showToast('Screenshot gespeichert'); }
            } catch (e) {}
        });
        
        document.getElementById('userBadge').addEventListener('click', openProfileModal);
        document.querySelectorAll('.nav-item[data-view="profile"]').forEach(item => item.addEventListener('click', openProfileModal));
        document.getElementById('closeProfileModal').addEventListener('click', () => profileModal.style.display = 'none');
        document.getElementById('saveProfileBtn').addEventListener('click', () => {
            playerName = editNameInput.value.trim() || playerName;
            userAvatar = currentEditAvatar;
            saveProfile();
            profileModal.style.display = 'none';
            showToast('Profil aktualisiert');
        });

        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach((item, index) => {
            item.addEventListener('click', () => {
                const view = item.dataset.view;
                if (view === 'profile') { openProfileModal(); return; }
                setView(view);
            });
        });
        updateNavIndicator(0);

        controlPanel.addEventListener('click', (e) => e.stopPropagation());
        drawer.addEventListener('click', (e) => e.stopPropagation());
        initStepCounter();
    };

    if (loadProfile()) {
        // wird vom Splashscreen aus gestartet
    } else {
        window.renderOnboardingOptions();
    }
})();
</script>

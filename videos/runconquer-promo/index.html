<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<script src="gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#06060A;font-family:'Poppins',sans-serif}
#root{position:relative;width:1080px;height:1920px;background:#06060A}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden}
.scene.boot{opacity:1;visibility:visible}

/* ── REAL FOOTAGE ── */
.clip{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;background:#0a0a12}
/* color grade: scene color over footage */
.grade{position:absolute;inset:0;mix-blend-mode:color;opacity:.42;pointer-events:none}
.dark{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,4,10,.62) 0%,transparent 30%,transparent 62%,rgba(4,4,10,.78) 100%);pointer-events:none}
/* conquering color wash sweeping up from the runner */
.wash{position:absolute;left:-30%;right:-30%;bottom:-22%;height:74%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,var(--c) 0%,color-mix(in srgb,var(--c) 55%,transparent) 38%,transparent 68%);
  mix-blend-mode:screen;opacity:.85;transform:scale(0)}
/* hex grid = invisible game world */
.hexol{position:absolute;inset:0;pointer-events:none;opacity:0}
.hexol svg{width:100%;height:100%}
.hexol polygon{fill:none;stroke:rgba(255,255,255,.34);stroke-width:2}
.hexol .lit{fill:var(--c);fill-opacity:.16;stroke:var(--c);stroke-opacity:.85;stroke-width:3}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.5) 100%);pointer-events:none}

/* ── TYPOGRAPHY ── */
.kin{position:absolute;left:0;right:0;z-index:30;text-align:center;padding:0 50px}
.kin .tag{display:inline-block;font-size:25px;font-weight:800;letter-spacing:8px;color:#fff;background:color-mix(in srgb,var(--c) 80%,#000);
  padding:12px 30px;border-radius:50px;text-transform:uppercase;margin-bottom:26px;box-shadow:0 0 36px var(--c)}
.kin .big{font-family:'Bebas Neue',sans-serif;color:#fff;line-height:.9;letter-spacing:3px;
  text-shadow:0 4px 30px rgba(0,0,0,.85)}
.kin .big em{font-style:normal;color:var(--c);text-shadow:0 0 50px var(--c),0 4px 30px rgba(0,0,0,.8)}
.top{top:150px}.bot{bottom:190px}.mid{top:50%;transform:translateY(-50%)}

/* ── HOOK ── */
#h0{background:#06060A}
#h0 .big{font-size:185px}
#h0-ping{position:absolute;top:50%;left:50%;width:10px;height:10px}
#h0-ping i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:3px solid #E8FF47;border-radius:50%;
  width:30px;height:30px;opacity:0;animation:ping 1.6s ease-out infinite}
#h0-ping i:nth-child(2){animation-delay:.5s}#h0-ping i:nth-child(3){animation-delay:1s}
@keyframes ping{0%{width:24px;height:24px;opacity:.95}100%{width:680px;height:680px;opacity:0}}

/* ── GAME MAP (aerial interlude) ── */
#gm{background:#0b0d18}
#gm-map{position:absolute;inset:0}
#gm-map svg{width:1080px;height:1920px}
.terr{opacity:.88}
.energy{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-dasharray:34 22;opacity:0;
  filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 26px rgba(180,220,255,.9))}
.gridline{stroke:rgba(255,255,255,.07);stroke-width:2}
.hud-chip{position:absolute;display:flex;align-items:center;gap:14px;background:rgba(10,12,24,.88);
  border:2px solid rgba(255,255,255,.16);border-radius:50px;padding:13px 28px;opacity:0;z-index:20}
.hud-dot{width:24px;height:24px;border-radius:50%}
.hud-pct{font-family:'Bebas Neue',sans-serif;font-size:40px;color:#fff}
.hud-nm{font-size:18px;letter-spacing:3px;color:rgba(255,255,255,.6)}

/* drone-city blob overlay */
.cityblob{position:absolute;border-radius:50%;mix-blend-mode:screen;opacity:0;pointer-events:none;filter:blur(4px)}

/* ── FINALE ── */
#fin{background:radial-gradient(ellipse at 50% 42%,#15172a 0%,#050508 70%)}
#fin-title{position:absolute;top:44%;left:0;right:0;transform:translateY(-50%);text-align:center}
#fin-title .w1,#fin-title .w2{display:block;font-family:'Bebas Neue',sans-serif;letter-spacing:5px}
#fin-title .w1{font-size:148px;color:#fff}
#fin-title .w2{font-size:196px;color:#E8FF47;letter-spacing:3px;text-shadow:0 0 70px rgba(232,255,71,.65),0 0 160px rgba(232,255,71,.3)}
#fin-title span span{display:inline-block}
#fin-bars{display:flex;gap:14px;justify-content:center;margin-top:42px}
#fin-bars i{display:block;width:88px;height:10px;border-radius:6px}
#fin-tag{margin-top:38px;font-size:29px;letter-spacing:10px;color:rgba(255,255,255,.72);text-transform:uppercase}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c);
  opacity:0;animation:sparkUp 3.2s ease-out infinite}
@keyframes sparkUp{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:.95}100%{opacity:0;transform:translateY(-420px) scale(1.2)}}

/* whip-cut flash */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90}
</style>
</head>
<body>
<div id="root">
<div id="flash"></div>

<!-- 0 HOOK -->
<div class="scene boot" id="h0" style="--c:#E8FF47">
  <div id="h0-ping"><i></i><i></i><i></i></div>
  <div class="kin mid" id="h0-t">
    <div class="big">ÜBER DEINER STADT LIEGT<br><em>EINE UNSICHTBARE WELT</em></div>
  </div>
</div>

<!-- FINALE -->
<div class="scene" id="fin">
  <div id="fin-pt"></div>
  <div id="fin-title">
    <span class="w1" id="fin-w1"></span>
    <span class="w2" id="fin-w2"></span>
    <div id="fin-bars">
      <i style="background:#FF2E97"></i><i style="background:#3AE880"></i><i style="background:#FF8800"></i><i style="background:#00CCFF"></i><i style="background:#E8FF47"></i>
    </div>
    <div id="fin-tag">Lauf · Erobere · Herrsche</div>
  </div>
</div>

<!-- GAME MAP INTERLUDE -->
<div class="scene" id="gm">
  <div id="gm-map"></div>
  <div class="kin top" style="--c:#E8FF47">
    <div class="big" style="font-size:104px" id="gm-t">TERRITORIEN WACHSEN.<br><em>GRENZEN ENTSTEHEN.</em></div>
  </div>
</div>

</div>
<script>
/* ══════════════════════════════════════════
   REAL-FOOTAGE SCENES (Pexels, free license)
══════════════════════════════════════════ */
const SCENES=[
 {id:'c1', vid:5310858, c:'#FF2E97', tag:'STADT',         pos:'top', big:'JEDER SCHRITT<br><em>FÄRBT SIE EIN</em>',      sz:118, t:[3.0,9.0],  wash:1, hex:1},
 {id:'c2', vid:8533442, c:'#FF2E97', tag:'',              pos:'mid', big:'<em>LAUF.</em>',                              sz:300, t:[9.0,12.4], wash:0, hex:0},
 {id:'c3', vid:4763892, c:'#FF2E97', tag:'PARKS',         pos:'bot', big:'EROBERE<br><em>STRASSEN &amp; PARKS</em>',    sz:110, t:[12.4,18.0],wash:1, hex:1},
 {id:'f1', vid:5677382, c:'#3AE880', tag:'WALD',          pos:'top', big:'<em>ÜBERALL</em><br>WIRD EROBERT',            sz:118, t:[18.0,23.4],wash:1, hex:1},
 {id:'f2', vid:5677451, c:'#3AE880', tag:'',              pos:'bot', big:'JEDE ROUTE…',                                 sz:130, t:[23.4,27.2],wash:0, hex:1},
 {id:'r1', vid:3028395, c:'#00CCFF', tag:'FLUSS',         pos:'top', big:'…WIRD <em>DEIN GEBIET</em>',                  sz:118, t:[27.2,32.4],wash:1, hex:1},
 {id:'r2', vid:3048928, c:'#00CCFF', tag:'',              pos:'bot', big:'DEINE FARBE.<br><em>DEINE SPUR.</em>',        sz:112, t:[32.4,36.6],wash:1, hex:0},
 /* game map interlude 36.6 – 44.2 */
 {id:'a1', vid:5319527, c:'#FF8800', tag:'VON OBEN',      pos:'top', big:'AUS <em>JEDER</em> PERSPEKTIVE',              sz:106, t:[44.2,49.2],wash:1, hex:1},
 {id:'a2', vid:8490468, c:'#FF8800', tag:'BERGE',         pos:'bot', big:'BIS ZUM <em>GIPFEL</em>',                     sz:120, t:[49.2,54.0],wash:1, hex:0},
 {id:'d1', vid:8491151, c:'#E8FF47', tag:'DEIN SPIELFELD',pos:'top', big:'DIE WELT IST<br><em>DEIN SPIELFELD</em>',     sz:108, t:[54.0,59.6],wash:0, hex:1, blobs:1},
 {id:'g1', vid:12510395,c:'#E8FF47', tag:'TEAM',          pos:'top', big:'<em>GEMEINSAM</em>',                          sz:150, t:[59.6,63.6],wash:1, hex:0},
 {id:'g2', vid:12510396,c:'#E8FF47', tag:'',              pos:'bot', big:'EROBERT IHR<br><em>SCHNELLER</em>',           sz:116, t:[63.6,68.0],wash:1, hex:1},
];
const GM_T=[36.6,44.2];           /* game-map interlude */
const FIN_T=68.0;                  /* finale start */
const TOTAL=76.5;

const TERR_COLORS=['#FF2E97','#3AE880','#FF8800','#00CCFF','#E8FF47'];
const root=document.getElementById('root');
const gmScene=document.getElementById('gm');

/* hex overlay svg factory */
function hexSvg(){
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 1080 1920');
  const R=98,w=R*1.732,h=R*1.5;
  let lits=[];
  for(let row=0;row<14;row++)for(let col=0;col<8;col++){
    const cx=col*w+(row%2?w/2:0),cy=row*h;
    let pts='';
    for(let k=0;k<6;k++){const a=Math.PI/180*(60*k-30);pts+=`${(cx+R*Math.cos(a)).toFixed(1)},${(cy+R*Math.sin(a)).toFixed(1)} `;}
    const p=document.createElementNS(NS,'polygon');
    p.setAttribute('points',pts.trim());
    if(Math.random()<.1){p.setAttribute('class','lit');p.style.opacity='0';lits.push(p);}
    svg.appendChild(p);
  }
  return {svg,lits};
}

/* build all footage scenes */
SCENES.forEach(s=>{
  const d=document.createElement('div');
  d.className='scene';d.id='sc_'+s.id;
  d.style.setProperty('--c',s.c);
  d.style.background=`linear-gradient(160deg,color-mix(in srgb,${s.c} 24%,#0a0a14),#0a0a14 70%)`;
  d.innerHTML=`
    <video class="clip" id="v_${s.id}" muted playsinline loop preload="none"
      data-src="https://www.pexels.com/download/video/${s.vid}/?w=960"></video>
    <div class="grade" style="background:${s.c}"></div>
    <div class="dark"></div>
    ${s.wash?`<div class="wash" id="w_${s.id}"></div>`:''}
    <div class="hexol" id="hx_${s.id}"></div>
    <div class="vign"></div>
    <div class="kin ${s.pos}" id="k_${s.id}">
      ${s.tag?`<div><span class="tag">${s.tag}</span></div>`:''}
      <div class="big" style="font-size:${s.sz}px">${s.big}</div>
    </div>`;
  root.insertBefore(d,document.getElementById('flash'));
  if(s.hex||s.blobs){
    const {svg,lits}=hexSvg();
    d.querySelector('#hx_'+s.id).appendChild(svg);
    s._lits=lits;
  }
  /* video error → keep gradient bg, hide broken video (ignore unload events) */
  const v=d.querySelector('video');
  v.addEventListener('error',()=>{if(v.getAttribute('src'))v.style.display='none';});
  /* drone-city: colored territory blobs over real footage */
  if(s.blobs){
    TERR_COLORS.forEach((c,i)=>{
      const b=document.createElement('div');
      b.className='cityblob';b.id=`cb${i}`;
      const x=[120,560,260,640,390][i],y=[520,640,1100,1240,880][i];
      const sz=[420,460,400,440,380][i];
      b.style.cssText+=`;left:${x}px;top:${y}px;width:${sz}px;height:${sz*0.82}px;background:radial-gradient(ellipse,${c} 0%,transparent 65%)`;
      d.insertBefore(b,d.querySelector('.vign'));
    });
  }
});

/* game map */
(function(){
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 1080 1920');
  let grid='';
  for(let y=0;y<1920;y+=110)grid+=`<line class="gridline" x1="0" y1="${y}" x2="1080" y2="${y}"/>`;
  for(let x=0;x<1080;x+=110)grid+=`<line class="gridline" x1="${x}" y1="0" x2="${x}" y2="1920"/>`;
  const blobs=[
    `M170,540 C90,420 220,300 380,330 C540,360 560,520 480,640 C400,760 250,690 170,540 Z`,
    `M760,420 C920,360 1040,480 990,640 C940,800 760,820 670,700 C580,580 620,470 760,420 Z`,
    `M280,1130 C180,1000 320,880 470,930 C620,980 640,1150 540,1260 C440,1370 360,1270 280,1130 Z`,
    `M790,1240 C950,1180 1060,1300 1000,1450 C940,1600 760,1610 680,1480 C600,1350 650,1290 790,1240 Z`,
    `M450,1620 C560,1530 730,1580 760,1720 C790,1860 640,1950 500,1900 C360,1850 350,1700 450,1620 Z`,
  ];
  let inner='';
  blobs.forEach((d,i)=>{inner+=`<path id="gt${i}" class="terr" d="${d}" fill="${TERR_COLORS[i]}" fill-opacity=".34" stroke="${TERR_COLORS[i]}" stroke-width="5"/>`;});
  [`M510,560 C560,600 620,640 660,690`,`M520,1240 C580,1290 640,1340 690,1400`,
   `M560,1500 C600,1560 640,1620 670,1680`,`M460,700 C440,790 420,880 430,960`].forEach((d,i)=>{
    inner+=`<path id="ge${i}" class="energy" d="${d}"/>`;});
  svg.innerHTML=grid+inner;
  document.getElementById('gm-map').appendChild(svg);
  const chips=[['#FF2E97','PINK CREW','28%'],['#3AE880','FOREST','22%'],['#FF8800','PEAK','17%'],['#00CCFF','RIVER','14%'],['#E8FF47','TEAM GELB','19%']];
  chips.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='hud-chip';d.id='gchip'+i;
    d.style.cssText+=`;left:${i%2?580:70}px;top:${500+Math.floor(i/2)*420}px`;
    d.innerHTML=`<div class="hud-dot" style="background:${c[0]};box-shadow:0 0 16px ${c[0]}"></div>
      <div><div class="hud-nm">${c[1]}</div><div class="hud-pct">${c[2]}</div></div>`;
    gmScene.appendChild(d);
  });
})();

/* finale letters + sparks */
(function(){
  const w1=document.getElementById('fin-w1'),w2=document.getElementById('fin-w2');
  'RUNNERS'.split('').forEach(ch=>{const s=document.createElement('span');s.textContent=ch;w1.appendChild(s);});
  'CONQUER'.split('').forEach(ch=>{const s=document.createElement('span');s.textContent=ch;w2.appendChild(s);});
  const pt=document.getElementById('fin-pt');
  TERR_COLORS.forEach(c=>{for(let i=0;i<8;i++){
    const s=document.createElement('div');s.className='spark';
    s.style.cssText=`--c:${c};left:${Math.random()*1080}px;bottom:${Math.random()*560}px;animation-delay:${(Math.random()*3.2).toFixed(2)}s`;
    pt.appendChild(s);
  }});
})();

/* ══════════════════════════════════════════
   PLAYBACK CONTROL + MASTER TIMELINE
══════════════════════════════════════════ */
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

function vEl(s){return document.getElementById('v_'+s.id);}
function showScene(el){gsap.set(el,{visibility:'visible',opacity:1});}
function hideScene(el){gsap.set(el,{visibility:'hidden',opacity:0});}
/* Memory management: keep at most ~2 clips buffered. Attach src shortly
   before a scene, fully detach + free the decoder right after it ends. */
function loadClip(s){
  const v=vEl(s);
  if(!v||v.getAttribute('src'))return;
  v.style.display='';
  v.src=v.dataset.src;
  v.preload='auto';
  v.load();
}
function unloadClip(s){
  const v=vEl(s);
  if(!v)return;
  v.pause();
  v.removeAttribute('src');
  v.load(); /* releases buffer + decoder */
}
function whip(at){
  tl.fromTo('#flash',{opacity:0},{opacity:.55,duration:.07,ease:'power4.in'},at-.07);
  tl.to('#flash',{opacity:0,duration:.14,ease:'power2.out'},at);
}

/* HOOK 0–3 */
tl.from('#h0-t .big',{y:70,opacity:0,duration:.7,ease:'power3.out'},.25);
tl.to('#h0-t .big',{scale:1.06,duration:2.4,ease:'none'},.5);

/* footage scenes */
SCENES.forEach((s,idx)=>{
  const [t0,t1]=s.t,el=document.getElementById('sc_'+s.id);
  /* attach + buffer 4s before the cut */
  tl.call(()=>loadClip(s),null,Math.max(0,t0-4));
  /* hard cut in */
  whip(t0);
  tl.call(()=>{showScene(el);loadClip(s);const v=vEl(s);if(v){try{if(v.readyState>0)v.currentTime=0;}catch(e){}v.play().catch(()=>{});}},null,t0);
  /* hide previous scene */
  if(idx===0)tl.call(()=>hideScene(document.getElementById('h0')),null,t0+.05);
  /* slow push-in on footage for cinema feel */
  tl.fromTo(el.querySelector('.clip'),{scale:1.12},{scale:1,duration:t1-t0,ease:'none'},t0);
  /* type in */
  const k=document.getElementById('k_'+s.id);
  if(k.querySelector('.tag'))tl.fromTo(k.querySelector('.tag'),{y:-36,opacity:0},{y:0,opacity:1,duration:.4,ease:'back.out(2)'},t0+.12);
  tl.fromTo(k.querySelector('.big'),{y:64,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},t0+.2);
  /* wash grows */
  if(s.wash)tl.fromTo('#w_'+s.id,{scale:0},{scale:1,duration:(t1-t0)*.9,ease:'power1.inOut'},t0+.3);
  /* hex overlay flickers in + cells light up */
  if(s._lits){
    tl.fromTo('#hx_'+s.id,{opacity:0},{opacity:.5,duration:.8},t0+.5);
    s._lits.slice(0,7).forEach((p,i)=>{
      tl.to(p,{opacity:1,duration:.3},t0+.8+i*((t1-t0-1.4)/7));
    });
  }
  /* city blobs on drone scene */
  if(s.blobs)for(let i=0;i<5;i++){
    tl.to('#cb'+i,{opacity:.75,duration:.8,ease:'power2.out'},t0+.6+i*.5);
    tl.to('#cb'+i,{scale:1.25,duration:t1-t0-1,ease:'none'},t0+.6+i*.5);
  }
  /* out: text exits, scene hides at next cut, clip fully unloaded to free RAM */
  tl.to(k,{opacity:0,y:-30,duration:.3},t1-.32);
  tl.call(()=>{hideScene(el);unloadClip(s);},null,t1+.4);
});

/* GAME MAP interlude */
whip(GM_T[0]);
tl.call(()=>showScene(gmScene),null,GM_T[0]);
tl.fromTo('#gm-t',{y:64,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},GM_T[0]+.15);
for(let i=0;i<5;i++)
  tl.fromTo('#gt'+i,{scale:0,transformOrigin:'50% 50%'},{scale:1,duration:1.3,ease:'elastic.out(1,.7)'},GM_T[0]+.3+i*.6);
for(let i=0;i<4;i++){
  tl.to('#ge'+i,{opacity:1,duration:.25},GM_T[0]+3.4+i*.5);
  tl.to('#ge'+i,{strokeDashoffset:-300,duration:3.6,ease:'none'},GM_T[0]+3.4+i*.5);
}
for(let i=0;i<5;i++)
  tl.fromTo('#gchip'+i,{opacity:0,y:24},{opacity:1,y:0,duration:.45,ease:'power3.out'},GM_T[0]+3.8+i*.3);
tl.fromTo('#gm-map',{scale:1.22},{scale:1,duration:GM_T[1]-GM_T[0],ease:'none'},GM_T[0]);
tl.to('#gm .kin',{opacity:0,y:-30,duration:.3},GM_T[1]-.32);
tl.call(()=>hideScene(gmScene),null,GM_T[1]+.08);

/* FINALE */
whip(FIN_T);
tl.call(()=>showScene(document.getElementById('fin')),null,FIN_T);
tl.from('#fin-w1 span',{y:90,opacity:0,duration:.5,stagger:.06,ease:'back.out(1.8)'},FIN_T+.4);
tl.from('#fin-w2 span',{y:110,opacity:0,scale:.6,duration:.55,stagger:.07,ease:'back.out(1.9)'},FIN_T+1.0);
tl.from('#fin-bars i',{scaleX:0,duration:.45,stagger:.07,ease:'power3.out'},FIN_T+2.0);
tl.from('#fin-tag',{opacity:0,letterSpacing:'26px',duration:.8,ease:'power2.out'},FIN_T+2.4);
tl.to('#fin-title',{scale:1.05,duration:TOTAL-FIN_T-2.8,ease:'sine.inOut'},FIN_T+2.8);
tl.to({},{duration:.01},TOTAL); /* pin total duration */

window.__timelines['main']=tl;

if(typeof window.__hyperframes==='undefined'){
  tl.play();
  tl.eventCallback('onComplete',function(){
    /* reset scenes then loop */
    document.querySelectorAll('.scene').forEach(s=>{s.style.visibility='hidden';s.style.opacity='0';});
    const h=document.getElementById('h0');h.style.visibility='visible';h.style.opacity='1';
    tl.restart();
  });
}
</script>
</body>
</html>

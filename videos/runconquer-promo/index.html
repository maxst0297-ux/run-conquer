<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<script src="gsap.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#06060A;font-family:'Poppins',sans-serif}
#root{position:relative;width:1080px;height:1920px;background:#06060A}
.scene{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden}
.scene.boot{opacity:1;visibility:visible}

/* ── REAL FOOTAGE ── */
.clip{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;background:#0a0a12}
.grade{position:absolute;inset:0;mix-blend-mode:color;opacity:.38;pointer-events:none}
.dark{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,4,10,.68) 0%,transparent 28%,transparent 60%,rgba(4,4,10,.82) 100%);pointer-events:none}
.wash{position:absolute;left:-30%;right:-30%;bottom:-22%;height:74%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 100%,var(--c) 0%,color-mix(in srgb,var(--c) 55%,transparent) 38%,transparent 68%);
  mix-blend-mode:screen;opacity:.85;transform:scale(0)}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.55) 100%);pointer-events:none}

/* ── TYPOGRAPHY ── */
.kin{position:absolute;left:0;right:0;z-index:30;text-align:center;padding:0 52px}
.kin .tag{display:inline-block;font-size:24px;font-weight:800;letter-spacing:7px;color:#fff;
  background:color-mix(in srgb,var(--c) 80%,#000);
  padding:11px 28px;border-radius:50px;text-transform:uppercase;margin-bottom:24px;box-shadow:0 0 34px var(--c)}
.kin .big{font-family:'Bebas Neue',sans-serif;color:#fff;line-height:.92;letter-spacing:3px;
  text-shadow:0 4px 30px rgba(0,0,0,.9)}
.kin .big em{font-style:normal;color:var(--c);text-shadow:0 0 52px var(--c),0 4px 30px rgba(0,0,0,.8)}
.top{top:140px}.bot{bottom:180px}.mid{top:50%;transform:translateY(-50%)}

/* ── GAME HUD OVERLAYS ── */
/* Score popup – left mid */
.score-pop{position:absolute;z-index:40;pointer-events:none;left:52px;top:860px;
  background:rgba(4,4,10,.90);border:2.5px solid var(--c);border-radius:22px;
  padding:24px 38px;box-shadow:0 0 44px color-mix(in srgb,var(--c) 48%,transparent)}
.score-pop .sp-pts{font-family:'Bebas Neue',sans-serif;font-size:92px;color:var(--c);
  text-shadow:0 0 32px var(--c);line-height:1;letter-spacing:2px}
.score-pop .sp-label{font-size:20px;letter-spacing:5px;color:rgba(255,255,255,.7);
  text-transform:uppercase;margin-top:6px}
/* Territory capture – bottom center */
.terr-cap{position:absolute;z-index:40;left:0;right:0;bottom:360px;pointer-events:none;text-align:center}
.terr-cap .tc-bar{display:inline-flex;flex-direction:column;align-items:center;
  background:rgba(4,4,10,.92);border:2.5px solid var(--c);border-radius:20px;
  padding:20px 46px;box-shadow:0 0 52px color-mix(in srgb,var(--c) 44%,transparent)}
.terr-cap .tc-icon{font-size:17px;letter-spacing:6px;color:rgba(255,255,255,.52);margin-bottom:8px}
.terr-cap .tc-name{font-family:'Bebas Neue',sans-serif;font-size:62px;color:#fff;letter-spacing:4px;line-height:1}
.terr-cap .tc-pts{font-family:'Bebas Neue',sans-serif;font-size:46px;color:var(--c);
  letter-spacing:2px;text-shadow:0 0 22px var(--c);margin-top:4px}
/* Leaderboard – right */
.lb-hud{position:absolute;z-index:40;right:52px;top:360px;pointer-events:none;
  background:rgba(4,4,10,.90);border:2px solid rgba(255,255,255,.12);border-radius:22px;
  padding:24px 30px;min-width:318px}
.lb-hud .lb-title{font-size:15px;letter-spacing:6px;color:rgba(255,255,255,.42);
  margin-bottom:18px;text-transform:uppercase}
.lb-hud .lb-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.lb-hud .lb-rank{font-family:'Bebas Neue',sans-serif;font-size:36px;color:rgba(255,255,255,.28);width:32px;flex-shrink:0}
.lb-hud .lb-rank.me{color:#E8FF47;text-shadow:0 0 14px #E8FF47}
.lb-hud .lb-name{font-size:18px;font-weight:600;color:#fff;flex:1}
.lb-hud .lb-name.me{color:#E8FF47}
.lb-hud .lb-sc{font-family:'Bebas Neue',sans-serif;font-size:32px;color:rgba(255,255,255,.65)}
.lb-hud .lb-sc.me{color:#E8FF47;text-shadow:0 0 12px #E8FF47}
/* Streak – left lower */
.streak-hud{position:absolute;z-index:40;left:52px;bottom:400px;pointer-events:none;
  background:rgba(4,4,10,.90);border:2.5px solid #FF8800;border-radius:20px;
  padding:20px 32px;box-shadow:0 0 38px rgba(255,136,0,.42);text-align:center}
.streak-hud .sh-fire{font-size:50px;line-height:1}
.streak-hud .sh-num{font-family:'Bebas Neue',sans-serif;font-size:86px;color:#FF8800;
  text-shadow:0 0 30px #FF8800;line-height:.9}
.streak-hud .sh-label{font-size:16px;letter-spacing:4px;color:rgba(255,255,255,.6);margin-top:4px}

/* ── HOOK ── */
#h0{background:#06060A}
#h0 .big{font-size:158px}
#h0-ping{position:absolute;top:50%;left:50%;width:10px;height:10px}
#h0-ping i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  border:3px solid #E8FF47;border-radius:50%;width:30px;height:30px;opacity:0;
  animation:ping 1.6s ease-out infinite}
#h0-ping i:nth-child(2){animation-delay:.5s}
#h0-ping i:nth-child(3){animation-delay:1s}
@keyframes ping{0%{width:24px;height:24px;opacity:.95}100%{width:680px;height:680px;opacity:0}}

/* ── GAME MAP (territory interlude) ── */
#gm{background:#0b0d18}
#gm-map{position:absolute;inset:0}
#gm-map svg{width:1080px;height:1920px}
.terr{opacity:.88}
.energy{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-dasharray:34 22;opacity:0;
  filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 26px rgba(180,220,255,.9))}
.gridline{stroke:rgba(255,255,255,.07);stroke-width:2}
.hud-chip{position:absolute;display:flex;align-items:center;gap:14px;
  background:rgba(10,12,24,.88);border:2px solid rgba(255,255,255,.16);
  border-radius:50px;padding:13px 28px;opacity:0;z-index:20}
.hud-dot{width:24px;height:24px;border-radius:50%}
.hud-pct{font-family:'Bebas Neue',sans-serif;font-size:40px;color:#fff}
.hud-nm{font-size:18px;letter-spacing:3px;color:rgba(255,255,255,.6)}

/* ── FINALE ── */
#fin{background:radial-gradient(ellipse at 50% 42%,#15172a 0%,#050508 70%)}
#fin-title{position:absolute;top:44%;left:0;right:0;transform:translateY(-50%);text-align:center}
#fin-title .w1,#fin-title .w2{display:block;font-family:'Bebas Neue',sans-serif;letter-spacing:5px}
#fin-title .w1{font-size:148px;color:#fff}
#fin-title .w2{font-size:196px;color:#E8FF47;letter-spacing:3px;
  text-shadow:0 0 70px rgba(232,255,71,.65),0 0 160px rgba(232,255,71,.3)}
#fin-title span span{display:inline-block}
#fin-bars{display:flex;gap:14px;justify-content:center;margin-top:42px}
#fin-bars i{display:block;width:88px;height:10px;border-radius:6px}
#fin-tag{margin-top:38px;font-size:29px;letter-spacing:10px;color:rgba(255,255,255,.72);text-transform:uppercase}
.spark{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--c);
  box-shadow:0 0 14px var(--c);opacity:0;animation:sparkUp 3.2s ease-out infinite}
@keyframes sparkUp{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:.95}100%{opacity:0;transform:translateY(-420px) scale(1.2)}}

/* whip-cut flash */
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:90}
</style>
</head>
<body>
<div id="root">
<div id="flash"></div>

<!-- HOOK -->
<div class="scene boot" id="h0" style="--c:#E8FF47">
  <div id="h0-ping"><i></i><i></i><i></i></div>
  <div class="kin mid" id="h0-t">
    <div class="big">DEINE STADT.<br><em>DEIN SPIELFELD.</em></div>
  </div>
</div>

<!-- FINALE -->
<div class="scene" id="fin">
  <div id="fin-pt"></div>
  <div id="fin-title">
    <span class="w1" id="fin-w1"></span>
    <span class="w2" id="fin-w2"></span>
    <div id="fin-bars">
      <i style="background:#FF2E97"></i><i style="background:#3AE880"></i>
      <i style="background:#FF8800"></i><i style="background:#00CCFF"></i>
      <i style="background:#E8FF47"></i>
    </div>
    <div id="fin-tag">Lauf · Erobere · Herrsche</div>
  </div>
</div>

<!-- GAME MAP INTERLUDE -->
<div class="scene" id="gm">
  <div id="gm-map"></div>
  <div class="kin top" style="--c:#E8FF47">
    <div class="big" style="font-size:100px" id="gm-t">TERRITORIEN WACHSEN.<br><em>GRENZEN ENTSTEHEN.</em></div>
  </div>
</div>

</div>
<script>
/* ══════════════════════════════════════════
   22 REAL RUNNING SCENES — Pexels free license
   Each 2.5s, adventurous cuts, game HUD overlays
══════════════════════════════════════════ */
const SCENES=[
 /* ─ CITY BLOCK ─ */
 {id:'s1',  vid:5310858,  c:'#FF2E97', tag:'STADTLAUF',  pos:'top', big:'JEDER SCHRITT<br><em>ZÄHLT</em>',         sz:122, t:[3.0,5.5],  wash:1, hud:{type:'score',pts:'+200',label:'PTS'}},
 {id:'s2',  vid:7877146,  c:'#00CCFF', tag:'',            pos:'mid', big:'<em>LAUF.</em>',                          sz:290, t:[5.5,8.0]},
 {id:'s3',  vid:8533442,  c:'#FF8800', tag:'TEMPO',       pos:'bot', big:'DEINE ROUTE<br><em>WIRD GEBIET</em>',     sz:108, t:[8.0,10.5], wash:1, hud:{type:'score',pts:'+50',label:'PTS / 100 M'}},
 /* ─ FOREST BLOCK ─ */
 {id:'s4',  vid:5677382,  c:'#3AE880', tag:'WALD',        pos:'top', big:'<em>WALD.</em><br>ERKUNDET.',             sz:132, t:[10.5,13.0],wash:1, hud:{type:'terr',name:'WALDGEBIET',pts:'+400 PTS',col:'#3AE880'}},
 {id:'s5',  vid:3028397,  c:'#3AE880', tag:'MORGENS',     pos:'bot', big:'FRÜH RAUS.<br><em>FRÜH VORN.</em>',       sz:108, t:[13.0,15.5],hud:{type:'streak',n:'7',label:'TAGE STREAK'}},
 /* ─ STREETS BLOCK ─ */
 {id:'s6',  vid:4763892,  c:'#FF2E97', tag:'BEZIRK',      pos:'top', big:'BEZIRK #7<br><em>EINGENOMMEN</em>',       sz:110, t:[15.5,18.0],wash:1, hud:{type:'score',pts:'+500',label:'TERRITORIUM!'}},
 {id:'s7',  vid:7876920,  c:'#00CCFF', tag:'',            pos:'bot', big:'<em>EROBERE.</em>',                       sz:250, t:[18.0,20.5]},
 /* ─ WATER BLOCK ─ */
 {id:'s8',  vid:3028395,  c:'#00CCFF', tag:'FLUSSUFER',   pos:'top', big:'FLUSSUFER<br><em>MARKIERT</em>',          sz:114, t:[20.5,23.0],wash:1, hud:{type:'score',pts:'+100',label:'PTS / KM'}},
 {id:'s9',  vid:5677451,  c:'#3AE880', tag:'FORSTGEBIET', pos:'bot', big:'DEINE FARBE.<br><em>DEINE SPUR.</em>',    sz:110, t:[23.0,25.5],wash:1, hud:{type:'terr',name:'FORSTGEBIET',pts:'+650 PTS',col:'#3AE880'}},
 /* ─ POWER BLOCK ─ */
 {id:'s10', vid:3048928,  c:'#FF2E97', tag:'',            pos:'top', big:'<em>HERRSCHE.</em>',                      sz:250, t:[25.5,28.0],hud:{type:'lb'}},
 {id:'s11', vid:19539315, c:'#00CCFF', tag:'REGEN',       pos:'bot', big:'REGEN HÄLT<br><em>DICH NICHT</em>',       sz:112, t:[28.0,30.5]},
 {id:'s12', vid:3125907,  c:'#FF8800', tag:'STRAND',      pos:'top', big:'STRANDGEBIET<br><em>EINGENOMMEN!</em>',   sz:104, t:[30.5,33.5],wash:1, hud:{type:'score',pts:'+300',label:'NEUE ZONE!'}},
 /* ─ GAME MAP 33.5–41.0 ─ */
 /* ─ MOUNTAIN BLOCK ─ */
 {id:'s13', vid:8490468,  c:'#FF8800', tag:'BERGE',       pos:'top', big:'BIS ZUM<br><em>GIPFEL</em>',              sz:132, t:[41.0,43.5],wash:1, hud:{type:'score',pts:'+1000',label:'BERGZONE!'}},
 {id:'s14', vid:5319527,  c:'#E8FF47', tag:'VON OBEN',    pos:'bot', big:'AUS JEDER<br><em>PERSPEKTIVE</em>',       sz:108, t:[43.5,46.0]},
 /* ─ RACE BLOCK ─ */
 {id:'s15', vid:31328832, c:'#FF2E97', tag:'MARATHON',    pos:'top', big:'WELTWEIT<br><em>ERKUNDET</em>',           sz:118, t:[46.0,48.5],wash:1, hud:{type:'terr',name:'MARATHON ROUTE',pts:'+2500 PTS',col:'#FF2E97'}},
 {id:'s16', vid:8491151,  c:'#E8FF47', tag:'FRAKTION',    pos:'bot', big:'<em>GEMEINSAM</em><br>STÄRKER',           sz:118, t:[48.5,51.0],wash:1, hud:{type:'streak',n:'14',label:'TAGE STREAK'}},
 /* ─ TEAM BLOCK ─ */
 {id:'s17', vid:12510395, c:'#3AE880', tag:'TEAM',        pos:'top', big:'DEINE FRAKTION<br><em>FÜHRT!</em>',       sz:114, t:[51.0,53.5],wash:1, hud:{type:'lb'}},
 {id:'s18', vid:12510396, c:'#3AE880', tag:'',            pos:'bot', big:'<em>LAUF.</em><br>EROBERE.',              sz:186, t:[53.5,56.0]},
 /* ─ FINALE RUN BLOCK ─ */
 {id:'s19', vid:32740423, c:'#FF8800', tag:'OPEN ROAD',   pos:'top', big:'OFFENE STRASSE<br><em>DEIN REVIER</em>',  sz:104, t:[56.0,58.5],wash:1, hud:{type:'score',pts:'+250',label:'ROUTE BONUS'}},
 {id:'s20', vid:19771786, c:'#00CCFF', tag:'TÄGLICH',     pos:'bot', big:'TÄGLICH<br><em>MEHR.</em>',               sz:132, t:[58.5,61.0],hud:{type:'score',pts:'×3',label:'MULTIPLIKATOR!'}},
 {id:'s21', vid:5488175,  c:'#FF2E97', tag:'24 GEBIETE',  pos:'top', big:'24 GEBIETE<br><em>DEIN!</em>',            sz:120, t:[61.0,63.5],wash:1, hud:{type:'terr',name:'STADTPARK',pts:'+750 PTS',col:'#FF2E97'}},
 {id:'s22', vid:32067871, c:'#E8FF47', tag:'SPRINT',      pos:'bot', big:'<em>ALLES!</em>',                         sz:268, t:[63.5,66.0],hud:{type:'score',pts:'+5000',label:'SPRINT BONUS!!'}},
];

const GM_T=[33.5,41.0];
const FIN_T=66.0;
const TOTAL=76.5;
const TERR_COLORS=['#FF2E97','#3AE880','#FF8800','#00CCFF','#E8FF47'];
const root=document.getElementById('root');
const gmScene=document.getElementById('gm');

/* ── HUD element factories ── */
function buildScorePop(s){
  const h=s.hud,d=document.createElement('div');
  d.className='score-pop';d.id='hud_'+s.id;
  d.style.setProperty('--c',s.c);d.style.opacity='0';
  d.innerHTML=`<div class="sp-pts">${h.pts}</div><div class="sp-label">${h.label}</div>`;
  return d;
}
function buildTerrCap(s){
  const h=s.hud,d=document.createElement('div');
  d.className='terr-cap';d.id='hud_'+s.id;
  d.style.setProperty('--c',h.col||s.c);d.style.opacity='0';
  d.innerHTML=`<div class="tc-bar"><div class="tc-icon">▲ TERRITORIUM EINGENOMMEN ▲</div><div class="tc-name">${h.name}</div><div class="tc-pts">${h.pts}</div></div>`;
  return d;
}
function buildLb(s){
  const d=document.createElement('div');
  d.className='lb-hud';d.id='hud_'+s.id;d.style.opacity='0';
  d.innerHTML=`<div class="lb-title">RANGLISTE</div>
    <div class="lb-row"><div class="lb-rank">#1</div><div class="lb-name">RunKing</div><div class="lb-sc">8.420</div></div>
    <div class="lb-row"><div class="lb-rank me">#2</div><div class="lb-name me">DU</div><div class="lb-sc me">7.890 ↑</div></div>
    <div class="lb-row"><div class="lb-rank">#3</div><div class="lb-name">SpeedX</div><div class="lb-sc">6.100</div></div>`;
  return d;
}
function buildStreak(s){
  const h=s.hud,d=document.createElement('div');
  d.className='streak-hud';d.id='hud_'+s.id;d.style.opacity='0';
  d.innerHTML=`<div class="sh-fire">🔥</div><div class="sh-num">${h.n}</div><div class="sh-label">${h.label}</div>`;
  return d;
}

/* ── build all footage scenes ── */
SCENES.forEach(s=>{
  const d=document.createElement('div');
  d.className='scene';d.id='sc_'+s.id;
  d.style.setProperty('--c',s.c);
  d.style.background=`linear-gradient(160deg,color-mix(in srgb,${s.c} 22%,#0a0a14),#0a0a14 70%)`;
  d.innerHTML=`
    <video class="clip" id="v_${s.id}" muted playsinline loop preload="none"
      data-src="https://www.pexels.com/download/video/${s.vid}/?w=960"></video>
    <div class="grade" style="background:${s.c}"></div>
    <div class="dark"></div>
    ${s.wash?`<div class="wash" id="w_${s.id}"></div>`:''}
    <div class="vign"></div>
    <div class="kin ${s.pos}" id="k_${s.id}">
      ${s.tag?`<div><span class="tag">${s.tag}</span></div>`:''}
      <div class="big" style="font-size:${s.sz}px">${s.big}</div>
    </div>`;
  root.insertBefore(d,document.getElementById('flash'));
  /* video load error → keep gradient background */
  const v=d.querySelector('video');
  v.addEventListener('error',()=>{if(v.getAttribute('src'))v.style.display='none';});
  /* inject HUD overlay */
  if(s.hud){
    let el;
    const t=s.hud.type;
    if(t==='score')  el=buildScorePop(s);
    else if(t==='terr')   el=buildTerrCap(s);
    else if(t==='lb')     el=buildLb(s);
    else if(t==='streak') el=buildStreak(s);
    if(el){d.appendChild(el);s._hud=el;}
  }
});

/* ── game map ── */
(function(){
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 1080 1920');
  let grid='';
  for(let y=0;y<1920;y+=110)grid+=`<line class="gridline" x1="0" y1="${y}" x2="1080" y2="${y}"/>`;
  for(let x=0;x<1080;x+=110)grid+=`<line class="gridline" x1="${x}" y1="0" x2="${x}" y2="1920"/>`;
  const blobs=[
    `M170,540 C90,420 220,300 380,330 C540,360 560,520 480,640 C400,760 250,690 170,540 Z`,
    `M760,420 C920,360 1040,480 990,640 C940,800 760,820 670,700 C580,580 620,470 760,420 Z`,
    `M280,1130 C180,1000 320,880 470,930 C620,980 640,1150 540,1260 C440,1370 360,1270 280,1130 Z`,
    `M790,1240 C950,1180 1060,1300 1000,1450 C940,1600 760,1610 680,1480 C600,1350 650,1290 790,1240 Z`,
    `M450,1620 C560,1530 730,1580 760,1720 C790,1860 640,1950 500,1900 C360,1850 350,1700 450,1620 Z`,
  ];
  let inner='';
  blobs.forEach((d,i)=>{
    inner+=`<path id="gt${i}" class="terr" d="${d}" fill="${TERR_COLORS[i]}" fill-opacity=".34" stroke="${TERR_COLORS[i]}" stroke-width="5"/>`;
  });
  [`M510,560 C560,600 620,640 660,690`,`M520,1240 C580,1290 640,1340 690,1400`,
   `M560,1500 C600,1560 640,1620 670,1680`,`M460,700 C440,790 420,880 430,960`].forEach((d,i)=>{
    inner+=`<path id="ge${i}" class="energy" d="${d}"/>`;
  });
  svg.innerHTML=grid+inner;
  document.getElementById('gm-map').appendChild(svg);
  const chips=[['#FF2E97','PINK CREW','28%'],['#3AE880','FOREST','22%'],['#FF8800','PEAK','17%'],['#00CCFF','RIVER','14%'],['#E8FF47','TEAM GELB','19%']];
  chips.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='hud-chip';d.id='gchip'+i;
    d.style.cssText+=`;left:${i%2?580:70}px;top:${500+Math.floor(i/2)*420}px`;
    d.innerHTML=`<div class="hud-dot" style="background:${c[0]};box-shadow:0 0 16px ${c[0]}"></div>
      <div><div class="hud-nm">${c[1]}</div><div class="hud-pct">${c[2]}</div></div>`;
    gmScene.appendChild(d);
  });
})();

/* ── finale letters + sparks ── */
(function(){
  const w1=document.getElementById('fin-w1'),w2=document.getElementById('fin-w2');
  'RUNNERS'.split('').forEach(ch=>{const s=document.createElement('span');s.textContent=ch;w1.appendChild(s);});
  'CONQUER'.split('').forEach(ch=>{const s=document.createElement('span');s.textContent=ch;w2.appendChild(s);});
  const pt=document.getElementById('fin-pt');
  TERR_COLORS.forEach(c=>{for(let i=0;i<8;i++){
    const s=document.createElement('div');s.className='spark';
    s.style.cssText=`--c:${c};left:${Math.random()*1080}px;bottom:${Math.random()*560}px;animation-delay:${(Math.random()*3.2).toFixed(2)}s`;
    pt.appendChild(s);
  }});
})();

/* ══════════════════════════════════════════
   MASTER TIMELINE
══════════════════════════════════════════ */
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});

function vEl(s){return document.getElementById('v_'+s.id);}
function showScene(el){gsap.set(el,{visibility:'visible',opacity:1});}
function hideScene(el){gsap.set(el,{visibility:'hidden',opacity:0});}
/* Memory management: max ~2 clips buffered at once */
function loadClip(s){
  const v=vEl(s);
  if(!v||v.getAttribute('src'))return;
  v.style.display='';v.src=v.dataset.src;v.preload='auto';v.load();
}
function unloadClip(s){
  const v=vEl(s);
  if(!v)return;
  v.pause();v.removeAttribute('src');v.load();
}
function whip(at){
  tl.fromTo('#flash',{opacity:0},{opacity:.52,duration:.07,ease:'power4.in'},at-.07);
  tl.to('#flash',{opacity:0,duration:.13,ease:'power2.out'},at);
}

/* HOOK 0–3s */
tl.from('#h0-t .big',{y:70,opacity:0,duration:.65,ease:'power3.out'},.2);
tl.to('#h0-t .big',{scale:1.06,duration:2.4,ease:'none'},.45);

/* footage scenes */
SCENES.forEach((s,idx)=>{
  const [t0,t1]=s.t;
  const el=document.getElementById('sc_'+s.id);
  /* buffer clip 4s ahead */
  tl.call(()=>loadClip(s),null,Math.max(0,t0-4));
  /* whip cut + show */
  whip(t0);
  tl.call(()=>{
    showScene(el);loadClip(s);
    const v=vEl(s);
    if(v){try{if(v.readyState>0)v.currentTime=0;}catch(e){}v.play().catch(()=>{});}
  },null,t0);
  if(idx===0)tl.call(()=>hideScene(document.getElementById('h0')),null,t0+.05);
  /* slow push-in for cinematic feel */
  tl.fromTo(el.querySelector('.clip'),{scale:1.1},{scale:1,duration:t1-t0,ease:'none'},t0);
  /* text in */
  const k=document.getElementById('k_'+s.id);
  if(k.querySelector('.tag'))
    tl.fromTo(k.querySelector('.tag'),{y:-28,opacity:0},{y:0,opacity:1,duration:.32,ease:'back.out(2)'},t0+.08);
  tl.fromTo(k.querySelector('.big'),{y:52,opacity:0},{y:0,opacity:1,duration:.38,ease:'power3.out'},t0+.13);
  /* color wash */
  if(s.wash)tl.fromTo('#w_'+s.id,{scale:0},{scale:1,duration:(t1-t0)*.88,ease:'power1.inOut'},t0+.22);
  /* HUD popup */
  if(s._hud){
    const hi='#hud_'+s.id;
    tl.fromTo(hi,{opacity:0,y:18},{opacity:1,y:0,duration:.38,ease:'back.out(2)'},t0+.52);
    tl.to(hi,{opacity:0,y:-14,duration:.28},t1-.42);
  }
  /* text out */
  tl.to(k,{opacity:0,duration:.24},t1-.26);
  /* hide scene + free memory */
  tl.call(()=>{hideScene(el);unloadClip(s);},null,t1+.4);
});

/* GAME MAP interlude 33.5–41.0 */
whip(GM_T[0]);
tl.call(()=>showScene(gmScene),null,GM_T[0]);
tl.fromTo('#gm-t',{y:64,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},GM_T[0]+.15);
for(let i=0;i<5;i++)
  tl.fromTo('#gt'+i,{scale:0,transformOrigin:'50% 50%'},{scale:1,duration:1.2,ease:'elastic.out(1,.7)'},GM_T[0]+.3+i*.56);
for(let i=0;i<4;i++){
  tl.to('#ge'+i,{opacity:1,duration:.25},GM_T[0]+3.2+i*.46);
  tl.to('#ge'+i,{strokeDashoffset:-300,duration:3.5,ease:'none'},GM_T[0]+3.2+i*.46);
}
for(let i=0;i<5;i++)
  tl.fromTo('#gchip'+i,{opacity:0,y:24},{opacity:1,y:0,duration:.42,ease:'power3.out'},GM_T[0]+3.6+i*.28);
tl.fromTo('#gm-map',{scale:1.22},{scale:1,duration:GM_T[1]-GM_T[0],ease:'none'},GM_T[0]);
tl.to('#gm .kin',{opacity:0,y:-30,duration:.3},GM_T[1]-.34);
tl.call(()=>hideScene(gmScene),null,GM_T[1]+.08);

/* FINALE 66–76.5 */
whip(FIN_T);
tl.call(()=>showScene(document.getElementById('fin')),null,FIN_T);
tl.from('#fin-w1 span',{y:90,opacity:0,duration:.5,stagger:.06,ease:'back.out(1.8)'},FIN_T+.4);
tl.from('#fin-w2 span',{y:110,opacity:0,scale:.6,duration:.55,stagger:.07,ease:'back.out(1.9)'},FIN_T+1.0);
tl.from('#fin-bars i',{scaleX:0,duration:.45,stagger:.07,ease:'power3.out'},FIN_T+2.0);
tl.from('#fin-tag',{opacity:0,letterSpacing:'26px',duration:.8,ease:'power2.out'},FIN_T+2.4);
tl.to('#fin-title',{scale:1.05,duration:TOTAL-FIN_T-2.8,ease:'sine.inOut'},FIN_T+2.8);
tl.to({},{duration:.01},TOTAL);

window.__timelines['main']=tl;

if(typeof window.__hyperframes==='undefined'){
  tl.play();
  tl.eventCallback('onComplete',function(){
    document.querySelectorAll('.scene').forEach(s=>{
      s.style.visibility='hidden';s.style.opacity='0';
    });
    const h=document.getElementById('h0');
    h.style.visibility='visible';h.style.opacity='1';
    tl.restart();
  });
}
</script>
</body>

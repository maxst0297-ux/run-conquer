<svg id="mapSvg" viewBox="0 0 480 480">
      <!-- Grid -->
      <g class="map-grid">
        <line x1="0" y1="80" x2="480" y2="80"></line>
        <line x1="0" y1="160" x2="480" y2="160"></line>
        <line x1="0" y1="240" x2="480" y2="240"></line>
        <line x1="0" y1="320" x2="480" y2="320"></line>
        <line x1="0" y1="400" x2="480" y2="400"></line>
        <line x1="80" y1="0" x2="80" y2="480"></line>
        <line x1="160" y1="0" x2="160" y2="480"></line>
        <line x1="240" y1="0" x2="240" y2="480"></line>
        <line x1="320" y1="0" x2="320" y2="480"></line>
        <line x1="400" y1="0" x2="400" y2="480"></line>
      </g>
      <!-- Roads -->
      <path class="map-road" d="M0 240 Q120 200 240 240 Q360 280 480 240"></path>
      <path class="map-road" d="M240 0 Q200 120 240 240 Q280 360 240 480"></path>
      <path class="map-road" d="M80 0 L80 480"></path>
      <path class="map-road" d="M400 0 L400 480"></path>
      <path class="map-road" d="M0 80 L480 80"></path>
      <path class="map-road" d="M0 400 L480 400"></path>
      <!-- Territories -->
      <polygon class="territory-poly" style="--delay:.2s" points="100,120 180,100 200,180 120,190" fill="rgba(255,77,109,.12)" stroke="#ff4d6d"></polygon>
      <polygon class="territory-poly" style="--delay:.5s" points="280,80 380,90 370,170 270,160" fill="rgba(155,93,229,.1)" stroke="#9b5de5"></polygon>
      <polygon class="territory-poly" style="--delay:.8s" points="300,260 400,250 410,340 290,350" fill="rgba(0,212,255,.1)" stroke="#00d4ff"></polygon>
      <polygon class="territory-poly" style="--delay:1.1s" points="60,300 160,290 170,380 50,390" fill="rgba(255,159,28,.1)" stroke="#ff9f1c"></polygon>
      <!-- GPS Trail -->
      <path class="gps-trail" d="M100,380 Q140,320 180,300 Q220,280 240,240 Q260,200 300,180 Q340,160 360,120 Q370,100 380,80"></path>
      <!-- Runner dot -->
      <circle class="runner-dot" cx="380" cy="80" r="7"></circle>
      <!-- Owned territory highlight -->
      <polygon class="territory-poly" style="--delay:1.5s" points="200,260 280,250 290,330 190,340" fill="rgba(232,255,71,.15)" stroke="#e8ff47" stroke-width="2"></polygon>
    </svg>
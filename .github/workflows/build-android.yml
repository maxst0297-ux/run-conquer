name: Build Android APK

on:
  push:
    branches: [main, claude/youthful-keller-KFHrk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js privacy.html promo.html altstore-source.json www/
          [ -d icons ] && cp -r icons www/
          [ -d screenshots ] && cp -r screenshots www/
          [ -f bg.mp4 ] && cp bg.mp4 www/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunConquer-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

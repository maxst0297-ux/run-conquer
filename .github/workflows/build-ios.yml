name: Build iOS IPA

on:
  push:
    branches: [main, claude/youthful-keller-KFHrk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets for Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js privacy.html promo.html altstore-source.json www/
          [ -d icons ] && cp -r icons www/
          [ -d screenshots ] && cp -r screenshots www/
          [ -f bg.mp4 ] && cp bg.mp4 www/

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p $RUNNER_TEMP/ipa/Payload
          cp -r "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" \
            "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r RunConquer.ipa Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunConquer-iOS
          path: ${{ runner.temp }}/ipa/RunConquer.ipa
          retention-days: 30

      - name: Determine release version
        if: github.ref == 'refs/heads/main'
        id: ver
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with IPA
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" \
            "$RUNNER_TEMP/ipa/RunConquer.ipa" \
            --title "RunConquer v${{ steps.ver.outputs.version }}" \
            --notes "Automated build from ${{ github.sha }}"

      - name: Bump AltStore source version
        if: github.ref == 'refs/heads/main'
        run: |
          SIZE=$(stat -f%z "$RUNNER_TEMP/ipa/RunConquer.ipa")
          jq --arg v "${{ steps.ver.outputs.version }}" \
             --arg d "${{ steps.ver.outputs.date }}" \
             --arg u "https://github.com/${{ github.repository }}/releases/latest/download/RunConquer.ipa" \
             --argjson s "$SIZE" \
             '.apps[0].version=$v | .apps[0].versionDate=$d | .apps[0].downloadURL=$u | .apps[0].size=$s' \
             altstore-source.json > altstore-source.tmp.json
          mv altstore-source.tmp.json altstore-source.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add altstore-source.json
          git diff --cached --quiet || git commit -m "Bump AltStore release to v${{ steps.ver.outputs.version }} [skip ci]"
          git push origin main
